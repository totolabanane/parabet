<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ParaBet — le marché à pronostics de Paladium</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0a0b0f;
    --surface: #121319;
    --surface-2: #191b23;
    --border: #23252f;
    --text: #eef0f4;
    --text-dim: #8a8fa3;
    --text-faint: #565b6e;
    --green: #10cf7c;
    --green-bg: rgba(16,207,124,0.12);
    --red: #ff4d5e;
    --red-bg: rgba(255,77,94,0.12);
    --amber: #f2b73f;
    --amber-bg: rgba(242,183,63,0.12);
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  a { color: inherit; }
  input, select { font-family: var(--font-body); }
  input::placeholder { color: var(--text-faint); }
  button { font-family: var(--font-body); cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }

  .max-w { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  /* top nav */
  .topnav {
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--border);
    background: rgba(10,11,15,0.9);
    backdrop-filter: blur(8px);
  }
  .topnav-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
  .logo-badge {
    width: 30px; height: 30px; background: var(--green); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .search-box {
    flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  }
  .search-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; }
  .wallet-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
  .wallet-chip .sep { width: 1px; height: 14px; background: var(--border); }
  .wallet-pseudo { font-size: 12px; color: var(--text-dim); }
  .wallet-balance { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--green); }
  .admin-tag { font-size: 10px; font-weight: 700; color: var(--amber); background: var(--amber-bg); border: 1px solid rgba(242,183,63,0.35); border-radius: 4px; padding: 2px 5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .icon-btn {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim);
    font-size: 14px;
  }
  .icon-btn:hover { color: var(--text); }
  .text-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text-dim); font-size: 12.5px; font-weight: 600; }
  .text-btn:hover { color: var(--text); border-color: #35384a; }
  .text-btn.amber { color: var(--amber); border-color: rgba(242,183,63,0.35); }

  .tabs { display: flex; gap: 20px; overflow-x: auto; padding: 0 16px; }
  .tab {
    background: none; border: none; padding: 10px 0; color: var(--text-dim); font-weight: 600;
    font-size: 13.5px; white-space: nowrap; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }

  .stats-row { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-dim); margin: 20px 0; }
  .stats-row span { display: flex; align-items: center; gap: 6px; }

  .grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover { border-color: #35384a; transform: translateY(-2px); }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-head-left { display: flex; align-items: flex-start; gap: 10px; }
  .cat-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .card-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; color: var(--text); }

  .pct-row { display: flex; align-items: center; gap: 8px; }
  .pct { font-family: var(--font-mono); font-size: 22px; font-weight: 800; }
  .pct-label { font-size: 11.5px; color: var(--text-faint); }

  .probbar { width: 100%; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
  .probbar > div { transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }

  .btn-row { display: flex; gap: 8px; margin-top: 2px; }
  .btn-yes, .btn-no {
    flex: 1; padding: 8px 0; border-radius: 8px; font-size: 12.5px; font-weight: 700;
    transition: background 0.12s ease, transform 0.06s ease;
  }
  .btn-yes { background: var(--green-bg); color: var(--green); border: 1px solid rgba(16,207,124,0.35); }
  .btn-yes:hover { background: var(--green); color: #06120c; }
  .btn-no { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,77,94,0.35); }
  .btn-no:hover { background: var(--red); color: #1a0608; }
  .btn-yes:active, .btn-no:active { transform: scale(0.97); }

  .resolved-badge { text-align: center; padding: 9px 0; border-radius: 8px; font-size: 12.5px; font-weight: 700; }
  .resolved-badge.yes { background: var(--green-bg); color: var(--green); }
  .resolved-badge.no { background: var(--red-bg); color: var(--red); }

  .card-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-faint); }

  .section-title { font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 40px 0 10px; display: flex; align-items: center; justify-content: space-between; }
  .feed-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; height: 160px; overflow-y: auto; }
  .feed-line { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .feed-empty { font-size: 12.5px; color: var(--text-faint); }

  .disclaimer { text-align: center; margin-top: 32px; font-size: 11.5px; color: var(--text-faint); padding-bottom: 60px; line-height: 1.6; }

  /* auth */
  .auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
  .auth-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; margin-bottom: 4px; }
  .auth-sub { font-size: 12.5px; color: var(--text-dim); margin: 0 0 22px; }
  .auth-tabs { display: flex; background: var(--surface-2); border-radius: 8px; padding: 3px; margin-bottom: 20px; }
  .auth-tab { flex: 1; padding: 8px 0; border: none; background: transparent; border-radius: 6px; color: var(--text-dim); font-weight: 600; font-size: 12.5px; }
  .auth-tab.active { background: var(--surface); color: var(--text); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 13.5px; padding: 10px 12px; outline: none;
  }
  .field input:focus { border-color: #414560; }
  .field-hint { font-size: 11px; color: var(--text-faint); margin-top: 5px; }
  .auth-error { background: var(--red-bg); border: 1px solid rgba(255,77,94,0.35); color: var(--red); font-size: 12px; border-radius: 8px; padding: 9px 11px; margin-bottom: 14px; }
  .auth-submit { width: 100%; padding: 11px 0; border-radius: 8px; font-size: 13.5px; font-weight: 700; background: var(--green); color: #06120c; border: none; margin-top: 4px; }
  .auth-submit:disabled { opacity: 0.55; }
  .auth-note { font-size: 11px; color: var(--text-faint); margin-top: 16px; line-height: 1.6; text-align: center; }

  /* admin */
  .admin-wrap { padding-top: 20px; }
  .admin-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .admin-section h3 { margin: 0 0 14px; font-size: 13.5px; }
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .admin-grid { grid-template-columns: 1fr; } }
  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border); padding: 12px 0; flex-wrap: wrap; }
  .admin-row:first-of-type { border-top: none; padding-top: 0; }
  .admin-row-title { font-size: 13px; font-weight: 600; flex: 1; min-width: 200px; }
  .admin-row-meta { font-size: 11px; color: var(--text-faint); }
  .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini-btn { padding: 6px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim); }
  .mini-btn.green { color: var(--green); border-color: rgba(16,207,124,0.35); }
  .mini-btn.red { color: var(--red); border-color: rgba(255,77,94,0.35); }
  .mini-btn.amber { color: var(--amber); border-color: rgba(242,183,63,0.35); }
  .mini-btn:hover { color: var(--text); }
  select { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13.5px; padding: 10px 12px; outline: none; }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(4,5,8,0.75); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .modal-kicker { font-size: 12px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
  .modal-close { background: none; border: none; color: var(--text-faint); font-size: 18px; line-height: 1; }
  .modal-title { font-size: 14px; font-weight: 600; margin: 14px 0 18px; line-height: 1.4; color: var(--text); }
  .modal-label { font-size: 12px; color: var(--text-dim); }
  .amount-row { display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; }
  .amount-row input {
    flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--font-mono); font-size: 15px; font-weight: 700; padding: 10px 12px; outline: none;
  }
  .quick-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .quick-btn { flex: 1; padding: 6px 0; font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); }
  .confirm-btn { width: 100%; padding: 12px 0; border-radius: 8px; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .low-balance { font-size: 11.5px; color: var(--red); margin-top: 10px; }
  .price-note { font-size: 11px; color: var(--text-faint); margin-top: 10px; }

  .faq-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
  .faq-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 4px 14px; }
  .faq-item[open] { padding-bottom: 12px; }
  .faq-question { cursor: pointer; list-style: none; padding: 12px 0; font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
  .faq-question::-webkit-details-marker { display: none; }
  .faq-question::after { content: "+"; color: var(--text-faint); font-size: 16px; font-weight: 400; margin-left: 10px; }
  .faq-item[open] .faq-question::after { content: "–"; }
  .faq-answer { font-size: 12.5px; line-height: 1.55; color: var(--text-dim); margin: 0; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 16px; font-size: 12.5px; z-index: 60; opacity: 0; transition: opacity 0.18s ease;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  .loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; gap: 10px; color: var(--text-dim); font-size: 13px; }

  /* casino */
  .casino-wrap { padding-top: 20px; padding-bottom: 60px; }
  .casino-table {
    background: radial-gradient(circle at 50% 0%, #14301f 0%, #0d1e14 70%);
    border: 1px solid var(--border); border-radius: 16px; padding: 24px 18px; margin-bottom: 20px;
  }
  .bj-row-label { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .bj-total { font-family: var(--font-mono); color: var(--green); background: var(--green-bg); border-radius: 5px; padding: 1px 7px; font-size: 11px; transition: transform 0.15s ease; animation: bjTotalPop 0.25s ease; }
  @keyframes bjTotalPop { 0% { transform: scale(0.7); opacity: 0.3; } 100% { transform: scale(1); opacity: 1; } }
  .bj-hand { display: flex; gap: 8px; min-height: 84px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; perspective: 700px; }
  .bj-card {
    width: 54px; height: 76px; border-radius: 7px; background: #f5f3ee; color: #17181c;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; box-shadow: 0 3px 8px rgba(0,0,0,0.35); flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.08);
    transform-style: preserve-3d; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .bj-card:not(.back):hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
  .bj-card.red { color: #d3273e; }
  .bj-card .bj-suit { font-size: 18px; margin-top: 2px; }
  .bj-card.back {
    background: repeating-linear-gradient(45deg, #1c3f2b, #1c3f2b 5px, #16321f 5px, #16321f 10px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .bj-card.bj-deal {
    animation: bjDeal 0.75s cubic-bezier(.19,1.15,.32,1) both;
    animation-delay: var(--bj-delay, 0ms);
  }
  @keyframes bjDeal {
    0% { opacity: 0; transform: translate(-70px, -90px) rotate(-25deg) scale(0.5); }
    55% { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
  }
  .bj-card.bj-flip { animation: bjFlip 0.75s cubic-bezier(.3,.1,.2,1) both; animation-delay: var(--bj-delay, 0ms); }
  @keyframes bjFlip {
    0% { transform: rotateY(-100deg) scale(0.92); filter: brightness(0.6); }
    60% { transform: rotateY(12deg) scale(1.02); filter: brightness(1); }
    100% { transform: rotateY(0deg) scale(1); filter: brightness(1); }
  }
  .bj-result-banner { text-align: center; padding: 10px 0; border-radius: 8px; font-size: 13.5px; font-weight: 700; margin-bottom: 18px; position: relative; overflow: visible; }
  .bj-result-banner.bj-fresh { animation: bjBannerPop 0.4s cubic-bezier(.3,1.6,.4,1) both; }
  @keyframes bjBannerPop { 0% { opacity: 0; transform: scale(0.82) translateY(8px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  .bj-result-banner.win, .bj-result-banner.blackjack { background: var(--green-bg); color: var(--green); }
  .bj-result-banner.lose { background: var(--red-bg); color: var(--red); }
  .bj-result-banner.push { background: var(--amber-bg); color: var(--amber); }
  .bj-particles { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .bj-particle { position: absolute; font-size: 15px; opacity: 0; animation: bjParticle 0.9s ease-out both; animation-delay: var(--bj-pdelay, 0ms); }
  @keyframes bjParticle {
    0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 0px), -42px) scale(1); }
  }
  .bj-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .bj-btn { flex: 1; min-width: 100px; padding: 12px 0; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); transition: transform 0.1s ease, border-color 0.15s ease; }
  .bj-btn:hover { border-color: #414560; }
  .bj-btn:active { transform: scale(0.96); }
  .bj-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .bj-btn:disabled:active { transform: none; }
  .bj-btn.primary { background: var(--green); color: #06120c; border: none; }
  .bj-btn.danger { color: var(--red); border-color: rgba(255,77,94,0.35); }
  .casino-table { transition: box-shadow 0.3s ease; }
  .casino-table.bj-dealing { animation: bjTableGlow 1.1s ease-in-out infinite; }
  @keyframes bjTableGlow { 0%, 100% { box-shadow: none; } 50% { box-shadow: 0 0 0 1px rgba(46,213,138,0.25), 0 0 26px rgba(46,213,138,0.14); } }
  .wallet-balance { display: inline-block; transition: color 0.2s ease; }
  .wallet-balance.bj-pulse-win { animation: bjBalancePulse 0.5s ease; color: var(--green); }
  .wallet-balance.bj-pulse-lose { animation: bjBalancePulse 0.5s ease; color: var(--red); }
  @keyframes bjBalancePulse { 0% { transform: scale(1); } 35% { transform: scale(1.22); } 100% { transform: scale(1); } }

  /* mise en page façon table de casino : panneau de mise + table à part */
  .bj-layout { display: flex; flex-direction: column; gap: 14px; }
  @media (min-width: 760px) { .bj-layout { flex-direction: row; align-items: flex-start; } }

  .bj-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; width: 100%; flex-shrink: 0;
  }
  @media (min-width: 760px) { .bj-panel { width: 270px; position: sticky; top: 76px; } }

  .bj-panel-label { display: flex; align-items: baseline; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
  .bj-panel-label-sub { font-size: 10px; font-weight: 600; color: var(--text-faint); text-transform: none; letter-spacing: normal; }

  .bj-panel-input-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .bj-panel-input-row input {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--font-mono); font-size: 15px; font-weight: 700; padding: 10px 12px; outline: none;
  }
  .bj-panel-input-row input:disabled { opacity: 0.5; }
  .bj-mini-btn {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-dim); font-size: 11.5px; font-weight: 700;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .bj-mini-btn:hover:not(:disabled) { color: var(--text); border-color: #414560; }
  .bj-mini-btn:active:not(:disabled) { transform: scale(0.92); }
  .bj-mini-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .bj-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 10px; }
  .bj-bet-btn { width: 100%; }

  .bj-table {
    position: relative; flex: 1; min-width: 0;
    background: radial-gradient(circle at 50% 0%, #14301f 0%, #0d1e14 70%);
    border: 1px solid var(--border); border-radius: 16px; padding: 24px 18px; margin-bottom: 0;
    min-height: 360px; display: flex; flex-direction: column; justify-content: center;
  }
  .bj-table-emblem { position: absolute; top: 14px; right: 16px; width: 38px; height: 38px; opacity: 0.55; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.45)); }
  .bj-table-emblem img { width: 100%; height: 100%; object-fit: contain; }

  .bj-idle { text-align: center; padding: 30px 10px; }
  .bj-ribbon {
    display: inline-block; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 11px 30px; margin-bottom: 12px;
    clip-path: polygon(3% 0, 97% 0, 100% 50%, 97% 100%, 3% 100%, 0 50%);
  }

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

// Valeur "maintenant" au format attendu par <input type="datetime-local">
// (heure locale du navigateur, sans fuseau), ex: "2026-08-04T21:15"
function nowLocalInputValue() {
  const d = new Date();
  d.setSeconds(0, 0);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

// Retourne l'heure de fin choisie pour un marché (pré-remplie à "maintenant"

function getResolveTime(marketId) {
  if (!state.adminResolveTime[marketId]) {
    state.adminResolveTime[marketId] = nowLocalInputValue();
  }
  return state.adminResolveTime[marketId];

  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
}

function sparkPoints(id, yes) {
  let seed = 0;
  for (let i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) % 997;
  const pts = [];
  let v = clamp(yes - 15 + (seed % 10), 5, 95);
  for (let i = 0; i < 8; i++) {
    seed = (seed * 53 + 7) % 997;
    v = clamp(v + (((seed % 21) - 10) * 0.9), 5, 95);
    pts.push(v);
  }
  pts.push(yes);
  return pts;
}
function sparklineSvg(id, yes) {
  const pts = sparkPoints(id, yes);
  const w = 64, h = 26;
  const step = w / (pts.length - 1);
  const path = pts.map((v, i) => `${i === 0 ? "M" : "L"} ${(i * step).toFixed(1)} ${(h - (v / 100) * h).toFixed(1)}`).join(" ");
  const up = pts[pts.length - 1] >= pts[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${up ? "var(--green)" : "var(--red)"}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/></svg>`;
}

/* ---------- client API : parle au backend Express ---------- */

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || "GET",
    headers: options.body instanceof FormData ? undefined : { "Content-Type": "application/json" },
    body: options.body instanceof FormData ? options.body : (options.body ? JSON.stringify(options.body) : undefined),
    credentials: "include",
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* pas de corps JSON */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `Erreur réseau (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ---------- image : compression avant envoi ---------- */

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read error"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image error"));
      img.onload = () => {
        const maxW = 1100;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
        canvas.toBlob(blob => resolve({ dataUrl, blob }), "image/jpeg", 0.78);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function visibleMarkets() {
  let list = state.filter === "all" ? state.markets : state.markets.filter(m => m.category === state.filter);

    const q = state.query.trim().toLowerCase();
    list = list.filter(m => m.title.toLowerCase().includes(q));
  }
  const statusRank = { open: 0, locked: 1, resolved: 2 };
  return [...list].sort((a, b) => {
    if (a.status !== b.status) return statusRank[a.status] - statusRank[b.status];
    return b.volume - a.volume;
  });
}

function bjSuitClass(s) { return (s === "♥" || s === "♦") ? "red" : ""; }

const BJ_DEAL_SLOT_MS = 260;   // pause entre chaque carte distribuée (suspense)
const BJ_BANNER_DELAY_MS = 380; // délai avant le bandeau de résultat, le temps que les dernières cartes se posent

// anim: "" | "bj-deal" | "bj-flip" — delaySlot: position dans la séquence de distribution (pour l'effet en cascade)
function bjCardHtml(c, anim, delaySlot) {
  const cls = anim ? ` ${anim}` : "";
  const style = anim ? ` style="--bj-delay:${(delaySlot || 0) * BJ_DEAL_SLOT_MS}ms"` : "";
  if (c.hidden) return `<div class="bj-card back${cls}"${style}></div>`;
  return `<div class="bj-card ${bjSuitClass(c.s)}${cls}"${style}><span>${c.r}</span><span class="bj-suit">${c.s}</span></div>`;
}

// Compare l'état précédemment affiché (state.bjAnim) à l'état actuel du jeu pour
// déterminer quelles cartes sont neuves (à faire "voler" sur la table) et laquelle
// vient d'être retournée (la carte cachée du croupier), puis met à jour le suivi.
function bjRenderHands(g) {
  const prevPlayerCount = state.bjAnim.playerCount || 0;
  const prevDealerHidden = state.bjAnim.dealerHidden || [];
  const prevDealerCount = prevDealerHidden.length;
  // le croupier retourne-t-il sa carte cachée sur ce rendu ? si oui, on laisse le
  // temps au retournement de se jouer avant de distribuer d'éventuelles cartes en plus
  const dealerFlips = prevDealerHidden[1] && g.dealer[1] && !g.dealer[1].hidden;

  const newPlayerIdxs = [];
  for (let i = prevPlayerCount; i < g.player.length; i++) newPlayerIdxs.push(i);
  const newDealerIdxs = [];
  for (let i = prevDealerCount; i < g.dealer.length; i++) newDealerIdxs.push(i);

  // distribution en alternance joueur/croupier, comme à une vraie table
  const playerDelay = {}, dealerDelay = {};
  let slot = dealerFlips ? 1 : 0, pi = 0, di = 0;
  while (pi < newPlayerIdxs.length || di < newDealerIdxs.length) {
    if (pi < newPlayerIdxs.length) { playerDelay[newPlayerIdxs[pi]] = slot++; pi++; }
    if (di < newDealerIdxs.length) { dealerDelay[newDealerIdxs[di]] = slot++; di++; }
  }

  const playerHtml = g.player.map((c, i) => {
    if (i in playerDelay) return bjCardHtml(c, "bj-deal", playerDelay[i]);
    return bjCardHtml(c, "", 0);
  }).join("");

  const dealerHtml = g.dealer.map((c, i) => {
    if (i in dealerDelay) return bjCardHtml(c, "bj-deal", dealerDelay[i]);
    if (prevDealerHidden[i] && !c.hidden) return bjCardHtml(c, "bj-flip", 0);
    return bjCardHtml(c, "", 0);
  }).join("");

  state.bjAnim.playerCount = g.player.length;
  state.bjAnim.dealerHidden = g.dealer.map(c => !!c.hidden);

  return { playerHtml, dealerHtml };
}

function bjParticlesHtml(result) {

const MINES_MIN_BET_CLIENT = 10; // doit correspondre à MINES_MIN_BET côté serveur
const MINES_GRID_SIZE_CLIENT = 25;

const MINES_GEM_URL = "https://static.wikia.nocookie.net/paladiumpvp/images/6/6c/P%C3%A9pite_d%27Endium.png/revision/latest?cb=20210730114131&path-prefix=fr";
const MINES_BOMB_URL = "https://static.wikia.nocookie.net/stardew-valley-minecraft-datapack/images/3/3b/Bomb.png/revision/latest?cb=20210611135240";

// Délégation d'événement pour les cases de la grille : un seul écouteur posé une
// fois pour toutes sur le document (au lieu de re-attacher un listener par case à
// chaque re-rendu), donc aucun clic ne peut jamais être "perdu" à cause d'un
// re-rendu qui a lieu au même moment que l'interaction de l'utilisateur.
document.addEventListener("click", (e) => {
  const tileBtn = e.target.closest("[data-tile]");
  if (tileBtn && !tileBtn.disabled) {
    minesReveal(Number(tileBtn.dataset.tile));
  }
});

async function openMines() {
  state.casinoGame = "mines";
  state.minesError = "";
  render();
  try {
    const s = await api("/api/casino/mines/state");
    state.mines = s.active ? s : null;
    state.minesAnim = new Set(s.active ? s.revealed : []);
  } catch (e) { /* ignore */ }
  render();
}

async function minesAction(path, body) {
  if (state.minesBusy) return;
  if (path === "start") state.minesAnim = new Set();
  state.minesBusy = true; state.minesError = ""; render();
  try {
    const r = await api(`/api/casino/mines/${path}`, { method: "POST", body });
    state.account.balance = r.balance;
    state.mines = r;
  } catch (e) {
    state.minesError = e.message;
  }
  state.minesBusy = false;
  render();
}

function minesStart() {
  const amount = clamp(Math.round(Number(state.minesBetAmount) || 0), MINES_MIN_BET_CLIENT, state.account.balance || MINES_MIN_BET_CLIENT);
  minesAction("start", { amount, mines: state.minesCount });
}
function minesReveal(tile) { minesAction("reveal", { tile }); }
function minesCashout() { minesAction("cashout"); }
function minesRandomPick() {
  const g = state.mines;
  if (!g || g.status !== "playing" || state.minesBusy) return;
  const revealedSet = new Set(g.revealed);
  const free = [];
  for (let i = 0; i < MINES_GRID_SIZE_CLIENT; i++) if (!revealedSet.has(i)) free.push(i);
  if (!free.length) return;
  minesReveal(free[Math.floor(Math.random() * free.length)]);
}

// Construit la grille : compare aux cases déjà affichées lors du rendu précédent
// (state.minesAnim) pour savoir lesquelles viennent d'être révélées (animation
// "mn-fresh"), puis met à jour ce suivi pour le prochain rendu.
function minesRenderTiles(g) {
  const prevRevealed = state.minesAnim || new Set();
  const revealedSet = new Set(g ? g.revealed : []);
  const finished = g && g.status !== "playing";
  const minesSet = new Set(finished ? g.mines : []);

  const html = Array.from({ length: MINES_GRID_SIZE_CLIENT }, (_, i) => {
    let cls = "mn-tile";
    let inner = "";
    const isRevealed = revealedSet.has(i);
    const isFresh = isRevealed && !prevRevealed.has(i);
    const clickable = g && g.status === "playing" && !isRevealed && !state.minesBusy;

    if (isRevealed) {
      if (minesSet.has(i)) { cls += ` mn-mine${isFresh ? " mn-fresh" : ""}`; inner = `<img src="${MINES_BOMB_URL}" alt="bombe" />`; }
      else { cls += ` mn-gem${isFresh ? " mn-fresh" : ""}`; inner = `<img src="${MINES_GEM_URL}" alt="gemme" />`; }
    } else if (finished && minesSet.has(i)) {
      cls += " mn-mine mn-dim"; inner = `<img src="${MINES_BOMB_URL}" alt="bombe" />`;
    }
    return `<button class="${cls}" data-tile="${i}" ${clickable ? "" : "disabled"}>${inner}</button>`;
  }).join("");

  state.minesAnim = revealedSet;
  return html;
}

/* ---------- rendering: bet & deposit modal ---------- */

function renderModal() {
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  if (state.depositModalOpen) { renderDepositModalContent(overlay, modal); return; }
  if (state.withdrawModalOpen) { renderWithdrawModalContent(overlay, modal); return; }
  if (state.referralModalOpen) { renderReferralModalContent(overlay, modal); return; }
  if (state.faqModalOpen) { renderFaqModalContent(overlay, modal); return; }
  if (state.legalModalOpen) { renderLegalModalContent(overlay, modal); return; }
  if (!state.openBet) { overlay.classList.remove("open"); return; }

  const market = state.markets.find(m => m.id === state.openBet.marketId);
  if (!market || market.status !== "open") { closeBetModal(); return; }
  const isYes = state.openBet.side === "yes";
  const balance = state.account.balance;
  const price = isYes ? market.yes : (100 - market.yes);
  const potential = Math.round(state.amount * 100 / Math.max(2, price));
  const quicks = [10, 50, 100, Math.max(10, balance)];

  modal.innerHTML = `
    <div class="modal-head">
      <span class="modal-kicker" style="color:${isYes ? "var(--green)" : "var(--red)"};">Mise sur "${isYes ? "Oui" : "Non"}"</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <p class="modal-title">${esc(market.title)}</p>
    <label class="modal-label">Montant · ${balance} 💎 disponibles</label>
    <div class="amount-row">
      <span style="font-family:var(--font-mono); font-size:15px; color:var(--text-faint);">💎</span>
      <input type="number" id="amountInput" min="10" max="${Math.max(10, balance)}" value="${state.amount}" />
    </div>
    <div class="quick-row">
      ${quicks.map((q, i) => `<button class="quick-btn" data-quick="${q}">${i === 3 ? "Max" : q}</button>`).join("")}
    </div>
    <button class="confirm-btn ${isYes ? "btn-yes" : "btn-no"}" id="confirmBtn" ${state.busy || balance < 10 ? "disabled style='opacity:0.55;'" : ""}>
      ${state.busy ? "Confirmation…" : "Confirmer la mise"}
    </button>
    <p class="price-note">Si "${isYes ? "Oui" : "Non"}" l'emporte, tu recevrais environ ${potential} 💎.</p>
    ${balance < 10 ? `<p class="low-balance">Solde insuffisant pour parier. Reviens demain pour ton bonus quotidien.</p>` : ""}
  `;

  overlay.classList.add("open");
  overlay.onclick = (e) => { if (e.target === overlay) closeBetModal(); };
  document.getElementById("modalClose").addEventListener("click", closeBetModal);
  const amountInput = document.getElementById("amountInput");
  amountInput.addEventListener("input", e => {
    state.amount = clamp(Math.round(Number(e.target.value) || 10), 10, Math.max(10, balance));
    renderModal();
  });
  document.querySelectorAll("[data-quick]").forEach(b => b.addEventListener("click", () => {
    state.amount = clamp(Number(b.dataset.quick), 10, Math.max(10, balance));
    renderModal();
  }));
  const confirmBtn = document.getElementById("confirmBtn");
  if (confirmBtn) confirmBtn.addEventListener("click", placeBet);
}

function renderDepositModalContent(overlay, modal) {
  const f = state.depositForm;
  const amountNum = Number(f.amount) || 0;
  const belowMin = amountNum > 0 && amountNum < DEPOSIT_MIN_AMOUNT;
  const usdValue = (amountNum * EMERALD_USD_RATE).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const quicks = [DEPOSIT_MIN_AMOUNT, 5000 + DEPOSIT_MIN_AMOUNT, 10000 + DEPOSIT_MIN_AMOUNT, 25000 + DEPOSIT_MIN_AMOUNT].filter((v, i, arr) => arr.indexOf(v) === i);
  const canSubmit = !state.depositBusy && !!f.blob && amountNum >= DEPOSIT_MIN_AMOUNT;

  modal.innerHTML = `
    <div class="modal-head">
      <span class="modal-kicker" style="color:var(--green);">Déposer des émeraudes Paladium</span>
      <button class="modal-close" id="depModalClose">✕</button>
    </div>
    <p class="modal-title">Effectuez un /pay totolabanane <montant> en jeu, indiquez le montant ci-dessous et joignez une capture d'écran du paiement comme preuve.</p>

    <label class="modal-label">Montant déposé (émeraudes en jeu)</label>
    <div class="amount-row">
      <span style="font-family:var(--font-mono); font-size:15px; color:var(--text-faint);">💎</span>
      <input type="number" id="depAmountInput" min="${DEPOSIT_MIN_AMOUNT}" value="${f.amount}" />
    </div>
    <p class="dep-usd">≈ ${usdValue} $ · taux : 1 💎 = ${EMERALD_USD_RATE.toFixed(2)} $</p>
    ${belowMin ? `<p class="dep-inline-error">Le minimum est de ${DEPOSIT_MIN_AMOUNT.toLocaleString("fr-FR")} 💎.</p>` : ""}
    <div class="quick-row">
      ${quicks.map(q => `<button class="quick-btn" data-depquick="${q}">${q.toLocaleString("fr-FR")}</button>`).join("")}
    </div>

    <label class="modal-label">Capture d'écran de la preuve (transaction / coffre / chat)</label>
    ${!f.dataUrl ? `
      <div class="dep-drop" id="depDrop">
        <div class="dep-drop-icon">📎</div>
        <div class="dep-drop-text"><b>Clique</b> ou glisse une image ici</div>
        <div class="dep-drop-hint">PNG, JPG… — compressée automatiquement</div>
        <input type="file" id="depFileInput" accept="image/*" />
      </div>
    ` : `
      <div class="dep-preview-wrap">
        <img src="${f.dataUrl}" />
        <button class="dep-preview-remove" id="depRemoveShot" title="Retirer l'image">✕</button>
      </div>
      <p class="dep-preview-name">📎 ${esc(f.fileName)}</p>
    `}

    ${amountNum >= DEPOSIT_MIN_AMOUNT && f.blob ? `
      <div class="dep-recap">
        Récap : demande de dépôt de <b>${amountNum.toLocaleString("fr-FR")} 💎</b> (≈ ${usdValue} $), avec preuve jointe.
        Le staff valide généralement en moins de 12h.
      </div>
    ` : ""}

    <button class="confirm-btn btn-yes" id="depConfirmBtn" style="margin-top:16px;" ${canSubmit ? "" : "disabled style='opacity:0.55;'"}>
      ${state.depositBusy ? "Envoi…" : "Envoyer la demande de dépôt"}
    </button>
    <p class="price-note">Montant minimum : ${DEPOSIT_MIN_AMOUNT.toLocaleString("fr-FR")} 💎. Le crédit n'est pas automatique : un membre du staff doit valider la preuve.</p>
  `;

  overlay.classList.add("open");
  overlay.onclick = (e) => { if (e.target === overlay) closeDepositModal(); };
  document.getElementById("depModalClose").addEventListener("click", closeDepositModal);

  document.getElementById("depAmountInput").addEventListener("input", e => {
    state.depositForm.amount = e.target.value;
    renderModal();
  });
  document.querySelectorAll("[data-depquick]").forEach(b => b.addEventListener("click", () => {
    state.depositForm.amount = Number(b.dataset.depquick);
    renderModal();
  }));

  const removeBtn = document.getElementById("depRemoveShot");
  if (removeBtn) removeBtn.addEventListener("click", removeDepositScreenshot);

  const dropZone = document.getElementById("depDrop");
  if (dropZone) {
    const fileInput = document.getElementById("depFileInput");
    fileInput.addEventListener("change", e => handleDepositFile(e.target.files[0]));
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      handleDepositFile(e.dataTransfer.files[0]);
    });
  }

  const confirmBtn = document.getElementById("depConfirmBtn");
  if (confirmBtn) confirmBtn.addEventListener("click", submitDeposit);
}

          <div class="admin-row">
            <div>
              <div class="admin-row-title">${esc(m.title)}</div>
              <div class="admin-row-meta">${CAT_META[m.category].label} · résultat : ${m.resolution === "yes" ? "Oui" : "Non"}${m.resolvedAt ? ` · marché terminé le ${new Date(m.resolvedAt).toLocaleString("fr-FR")}` : ""}</div>
            </div>
            <div class="admin-actions">
              <button class="mini-btn" data-delete="${m.id}">Supprimer</button>
            </div>
          </div>
        `).join("")}
      </div>

      <div class="admin-section">
        <h3>Dépôts en attente (${pendingDeposits.length})</h3>
        ${pendingDeposits.length === 0 ? `<p class="admin-row-meta">Aucune demande de dépôt en attente.</p>` : pendingDeposits.map(d => `
          <div class="admin-row" style="align-items:flex-start;">
            <div style="display:flex; gap:12px; align-items:flex-start; flex:1; min-width:220px;">
              <img src="${d.screenshot}" data-viewshot="${d.id}" title="Cliquer pour agrandir"
                   style="width:88px; height:88px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer; flex-shrink:0;" />
              <div>
                <div class="admin-row-title">${esc(d.pseudo)} — ${d.amount} 💎</div>
                <div class="admin-row-meta">Demandé le ${new Date(d.ts).toLocaleString("fr-FR")}</div>
              </div>
            </div>
            <div class="admin-actions">
              <button class="mini-btn green" data-approve-dep="${d.id}">Approuver</button>
              <button class="mini-btn red" data-reject-dep="${d.id}">Refuser</button>
            </div>
          </div>
        `).join("")}
      </div>

      <div class="admin-section">
        <h3>Historique des dépôts (${pastDeposits.length})</h3>
        ${pastDeposits.length === 0 ? `<p class="admin-row-meta">Aucun dépôt traité pour l'instant.</p>` : pastDeposits.slice(0, 40).map(d => `
          <div class="admin-row">
            <div>
              <div class="admin-row-title">${esc(d.pseudo)} — ${d.amount} 💎</div>
              <div class="admin-row-meta">${d.status === "approved" ? "Approuvé" : "Refusé"} · ${new Date(d.ts).toLocaleString("fr-FR")}</div>
            </div>
            <div class="admin-actions">
              <button class="mini-btn" data-viewshot="${d.id}">Voir la preuve</button>
              <button class="mini-btn" data-delete-dep="${d.id}">Supprimer</button>
            </div>
          </div>
        `).join("")}
      </div>

      <p class="disclaimer">Résoudre un marché paie automatiquement tous les joueurs qui ont misé sur le bon résultat avant l'heure de fin indiquée, en émeraudes fictives, proportionnellement à la cote au moment de leur mise. Les paris placés après cette heure (ex: pari passé une fois l'événement déjà terminé) sont simplement remboursés, sans gain ni perte. Approuver un dépôt crédite immédiatement le solde du joueur : vérifie bien la capture d'écran avant de valider.</p>

      <div class="admin-section">
        <h3>Retraits en attente (${pendingWithdrawals.length})</h3>
        ${pendingWithdrawals.length === 0 ? `<p class="admin-row-meta">Aucune demande de retrait en attente.</p>` : pendingWithdrawals.map(w => `
          <div class="admin-row">
            <div>
              <div class="admin-row-title">${esc(w.pseudo)} — ${w.amount} 💎</div>
              <div class="admin-row-meta">Pseudo Paladium à payer : <strong>${esc(w.minecraftPseudo || "—")}</strong></div>
              <div class="admin-row-meta">Demandé le ${new Date(w.ts).toLocaleString("fr-FR")}</div>
            </div>
            <div class="admin-actions">
              <button class="mini-btn green" data-approve-wd="${w.id}">Marquer payé</button>
              <button class="mini-btn red" data-reject-wd="${w.id}">Refuser</button>
            </div>
          </div>
        `).join("")}
      </div>

      <div class="admin-section">
        <h3>Historique des retraits (${pastWithdrawals.length})</h3>
        ${pastWithdrawals.length === 0 ? `<p class="admin-row-meta">Aucun retrait traité pour l'instant.</p>` : pastWithdrawals.slice(0, 40).map(w => `
          <div class="admin-row">
            <div>
              <div class="admin-row-title">${esc(w.pseudo)} — ${w.amount} 💎</div>
              <div class="admin-row-meta">Pseudo Paladium : ${esc(w.minecraftPseudo || "—")}</div>
              <div class="admin-row-meta">${w.status === "approved" ? "Payé" : "Refusé"} · ${new Date(w.ts).toLocaleString("fr-FR")}</div>
            </div>
            <div class="admin-actions">
              <button class="mini-btn" data-delete-wd="${w.id}">Supprimer</button>
            </div>
          </div>
        `).join("")}
      </div>

      <p class="disclaimer">Marquer un retrait "payé" confirme que tu as remis les émeraudes au joueur en jeu — le solde ParaBet a déjà été débité à la demande. Le refuser recrédite automatiquement le joueur.</p>
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", async () => { state.view = "app"; await loadEverything(); render(); });
  document.getElementById("logoutBtn").addEventListener("click", handleLogout);
  document.getElementById("fTitle").addEventListener("input", e => { state.adminForm.title = e.target.value; });
  document.getElementById("fCategory").addEventListener("change", e => { state.adminForm.category = e.target.value; });
  document.getElementById("fYes").addEventListener("input", e => { state.adminForm.yes = e.target.value; });
  document.getElementById("fCloses").addEventListener("input", e => { state.adminForm.closes = e.target.value; });
  document.getElementById("createBtn").addEventListener("click", adminCreateMarket);
  document.querySelectorAll("[data-resolve-time]").forEach(inp => inp.addEventListener("change", e => {
    state.adminResolveTime[inp.dataset.resolveTime] = e.target.value;
  }));
  document.querySelectorAll("[data-set-now]").forEach(b => b.addEventListener("click", () => {
    state.adminResolveTime[b.dataset.setNow] = nowLocalInputValue();
    render();
  }));
  document.querySelectorAll("[data-resolve]").forEach(b => b.addEventListener("click", () => {
    const [marketId, outcome] = b.dataset.resolve.split("|");
    const timeInput = document.querySelector(`[data-resolve-time="${marketId}"]`);
    const resolvedAtLocal = timeInput ? timeInput.value : getResolveTime(marketId);
    if (!resolvedAtLocal) { showToast("Indique l'heure à laquelle le marché s'est terminé."); return; }
    const prettyTime = new Date(resolvedAtLocal).toLocaleString("fr-FR");
    if (confirm(`Résoudre ce marché avec le résultat "${outcome === "yes" ? "Oui" : "Non"}" (marché terminé le ${prettyTime}) ? Les paris placés après cette heure seront remboursés. Cette action est définitive et paiera les gagnants.`)) {
      adminResolveMarket(marketId, outcome, resolvedAtLocal);
    }
  }));
  document.querySelectorAll("[data-delete]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Supprimer ce marché définitivement ?")) adminDeleteMarket(b.dataset.delete);
  }));
  document.querySelectorAll("[data-lock]").forEach(b => b.addEventListener("click", () => adminLockMarket(b.dataset.lock)));
  document.querySelectorAll("[data-unlock]").forEach(b => b.addEventListener("click", () => adminUnlockMarket(b.dataset.unlock)));
  document.querySelectorAll("[data-setpct]").forEach(b => b.addEventListener("click", () => {
    const input = document.querySelector(`[data-pct-input="${b.dataset.setpct}"]`);
    adminSetPct(b.dataset.setpct, input ? input.value : "");
  }));
  document.querySelectorAll("[data-approve-dep]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Confirmer ce dépôt ? Le montant sera crédité immédiatement sur le compte du joueur.")) {
      adminApproveDeposit(b.dataset.approveDep);
    }
  }));
  document.querySelectorAll("[data-reject-dep]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Refuser cette demande de dépôt ?")) adminRejectDeposit(b.dataset.rejectDep);
  }));
  document.querySelectorAll("[data-delete-dep]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Supprimer cet historique de dépôt ?")) adminDeleteDeposit(b.dataset.deleteDep);
  }));
  document.querySelectorAll("[data-approve-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Confirmer que tu as bien remis les émeraudes en jeu à ce joueur ?")) {
      adminApproveWithdrawal(b.dataset.approveWd);
    }
  }));
  document.querySelectorAll("[data-reject-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Refuser cette demande de retrait ? Le solde du joueur sera recrédité.")) {
      adminRejectWithdrawal(b.dataset.rejectWd);
    }
  }));
  document.querySelectorAll("[data-delete-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Supprimer cet historique de retrait ?")) adminDeleteWithdrawal(b.dataset.deleteWd);
  }));
  document.querySelectorAll("[data-viewshot]").forEach(el => el.addEventListener("click", () => {
    const dep = state.deposits.find(d => d.id === Number(el.dataset.viewshot) || d.id === el.dataset.viewshot);
    if (dep) viewScreenshotFull(dep.screenshot);
  }));
  document.querySelectorAll("[data-set-balance]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.setBalance;
    const input = document.querySelector(`[data-balance-input="${id}"]`);
    const value = input ? input.value : "";
    if (!confirm(`Fixer le solde de ce joueur à ${value} 💎 ?`)) return;
    adminSetBalance(id, "balance", value);
  }));
  document.querySelectorAll("[data-adjust-balance]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.adjustBalance;
    const input = document.querySelector(`[data-delta-input="${id}"]`);
    const value = input ? input.value : "";
    adminSetBalance(id, "delta", value);
  }));
  document.querySelectorAll("[data-toggle-account]").forEach(el => el.addEventListener("click", () => {
    toggleAccountBets(el.dataset.toggleAccount);
  }));
  document.querySelectorAll("[data-toggle-account-casino]").forEach(el => el.addEventListener("click", () => {
    toggleAccountCasinoBets(el.dataset.toggleAccountCasino);
  }));
}

/* ---------- boot ---------- */

boot();
</script>
</body>
</html>
