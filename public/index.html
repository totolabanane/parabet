<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ParaBet — le marché à pronostics de Paladium</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Press+Start+2P&family=VT323&display=swap');

  :root {
    --bg: #070912;
    --bg-deep: #05060d;
    --surface: #121a2c;
    --surface-2: #1a2338;
    --border: #263250;
    --border-soft: rgba(154,175,215,0.14);
    --text: #eef1fb;
    --text-dim: #96a3c4;
    --text-faint: #57628a;
    --green: #8B5CF6;
    --green-hi: #8FB6EE;
    --green-bg: rgba(139,92,246,0.12);
    --green-deep: #21324B;
    --red: #ff5c6a;
    --red-bg: rgba(255,92,106,0.12);
    --amber: #eeb654;
    --amber-bg: rgba(238,182,84,0.12);
    --font-display: 'Space Grotesk', var(--font-body);
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); font-family: var(--font-body); padding-bottom: 46px;
    background:
      radial-gradient(ellipse 900px 480px at 15% -8%, rgba(139,92,246,0.10), transparent 60%),
      radial-gradient(ellipse 700px 520px at 100% 0%, rgba(238,182,84,0.06), transparent 55%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 68px),
      var(--bg-deep);
    background-attachment: fixed;
  }
  a { color: inherit; }
  input, select { font-family: var(--font-body); }
  input::placeholder { color: var(--text-faint); }
  button { font-family: var(--font-body); cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .max-w { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  /* top nav */
  .topnav {
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--border);
    background: rgba(7,9,15,0.86);
    backdrop-filter: blur(10px);
    box-shadow: 0 1px 0 rgba(139,92,246,0.06);
  }
  .topnav-row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 17.5px; letter-spacing: -0.01em; }
  .logo-badge {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 15px;
    background: linear-gradient(155deg, var(--green-hi), var(--green) 55%, var(--green-deep));
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    box-shadow: 0 0 0 1px rgba(139,92,246,0.25), 0 4px 14px rgba(139,92,246,0.28);
  }
  .logo-ingot { display: block; flex-shrink: 0; filter: drop-shadow(0 3px 10px rgba(139,92,246,0.3)); }
  .logo-word { display: inline-flex; }
  .logo-word .lw-para { color: var(--text); }
  .logo-word .lw-bet { color: var(--green-hi); }
  .search-box {
    flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px;
    transition: border-color 0.15s ease;
  }
  .search-box:focus-within { border-color: rgba(139,92,246,0.45); }
  .search-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; }
  .wallet-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; }
  .wallet-chip .sep { width: 1px; height: 14px; background: var(--border); }
  .wallet-pseudo { font-size: 12px; color: var(--text-dim); }
  .wallet-balance { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--green-hi); }
  .admin-tag { font-size: 10px; font-weight: 700; color: var(--amber); background: var(--amber-bg); border: 1px solid rgba(238,182,84,0.35); border-radius: 4px; padding: 2px 5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .icon-btn {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px; color: var(--text-dim);
    font-size: 14px; transition: color 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-soft); }
  .text-btn { background: none; border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; color: var(--text-dim); font-size: 12.5px; font-weight: 600; transition: color 0.15s ease, border-color 0.15s ease; }
  .text-btn:hover { color: var(--text); border-color: #3a5245; }
  .text-btn.amber { color: var(--amber); border-color: rgba(238,182,84,0.35); }

  /* nav toolbar — actions groupées au lieu d'une ligne de boutons collés */
  .nav-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nav-primary-actions { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .nav-primary-actions .text-btn { border: none; padding: 7px 12px; border-radius: 7px; }
  .nav-primary-actions .text-btn:hover { background: var(--surface-2); }
  .nav-primary-actions .text-btn.deposit { color: var(--green-hi); }
  .nav-more-wrap { position: relative; }
  .nav-more-menu {
    position: absolute; top: calc(100% + 8px); right: 0; min-width: 208px; z-index: 30;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 6px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 1px;
  }
  .nav-more-menu[hidden] { display: none; }
  .nav-more-menu button, .nav-more-menu a {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: none; border-radius: 8px; padding: 9px 10px;
    color: var(--text); font-size: 13px; font-family: var(--font-body); text-decoration: none;
  }
  .nav-more-menu button:hover, .nav-more-menu a:hover { background: var(--surface); }
  .nav-more-menu .nav-menu-divider { height: 1px; background: var(--border); margin: 4px 2px; }

  .tabs { display: flex; gap: 22px; overflow-x: auto; padding: 0 16px; }
  .tab {
    background: none; border: none; padding: 11px 0; color: var(--text-dim); font-family: var(--font-display); font-weight: 600;
    font-size: 13.5px; white-space: nowrap; border-bottom: 2px solid transparent; transition: color 0.15s ease;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--green); text-shadow: 0 0 18px rgba(139,92,246,0.35); }

  .stats-row { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-dim); margin: 22px 0; padding-bottom: 14px; border-bottom: 1px solid var(--border-soft); }
  .stats-row span { display: flex; align-items: center; gap: 6px; }

  /* stat chips */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0 26px; }
  .stat-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; display: flex; align-items: center; gap: 11px; }
  .stat-chip-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .stat-chip-value { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .stat-chip-label { font-size: 10.5px; color: var(--text-faint); margin-top: 1px; }

  /* page "Mon profil" */
  .profile-header {
    display: flex; align-items: center; gap: 16px; padding: 22px; border-radius: 16px; border: 1px solid var(--border);
    background: radial-gradient(ellipse 420px 240px at 100% -20%, rgba(139,92,246,0.16), transparent 65%), linear-gradient(175deg, var(--surface), #0d1424);
    margin: 20px 0 8px;
  }
  .profile-avatar {
    width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #150c2a; letter-spacing: -0.02em;
    background: linear-gradient(155deg, var(--green-hi), var(--green) 55%, var(--green-deep));
    box-shadow: 0 4px 16px rgba(139,92,246,0.3);
  }
  .profile-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .profile-sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .profile-filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0 12px; }
  .profile-filter-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 13px; font-size: 12px; font-weight: 600; color: var(--text-dim); transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease; }
  .profile-filter-chip:hover { border-color: #3a4568; color: var(--text); }
  .profile-filter-chip.active { background: var(--green-bg); border-color: rgba(139,92,246,0.45); color: var(--green-hi); }
  .profile-bet-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
  .profile-bet-row:last-child { border-bottom: none; }
  .profile-bet-side { font-size: 10.5px; font-weight: 800; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; }
  .profile-bet-side.yes { background: var(--green-bg); color: var(--green-hi); }
  .profile-bet-side.no { background: var(--red-bg); color: var(--red); }
  .profile-bet-title { font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-bet-meta { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
  .profile-bet-result { font-family: var(--font-mono); font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; text-align: right; }

  /* hero — marché du moment */
  .hero-banner {
    position: relative; overflow: hidden; border-radius: 18px; border: 1px solid var(--border);
    padding: 26px 26px 22px; margin: 20px 0 8px;
    background: radial-gradient(ellipse 520px 320px at 100% -10%, var(--hero-tint, rgba(139,92,246,0.16)), transparent 65%), linear-gradient(175deg, var(--surface), #0d1712);
  }
  .hero-banner::after {
    content: ""; position: absolute; top: -60%; right: -8%; width: 260px; height: 260px;
    background: var(--hero-tint, rgba(139,92,246,0.16)); filter: blur(60px); border-radius: 50%; pointer-events: none;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.07em; color: var(--hero-color, var(--green)); margin-bottom: 12px;
  }
  .hero-grid { position: relative; display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 720px) { .hero-grid { flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 24px; } }
  .hero-title { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.28; letter-spacing: -0.01em; max-width: 560px; }
  .hero-side { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
  .hero-pct { font-family: var(--font-mono); font-size: 38px; font-weight: 800; line-height: 1; color: var(--hero-color, var(--green)); }
  .hero-pct-label { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .hero-actions { display: flex; gap: 8px; }
  .hero-actions .btn-yes, .hero-actions .btn-no { padding: 11px 16px; font-size: 13px; white-space: nowrap; }
  .hero-meta { position: relative; display: flex; gap: 16px; margin-top: 16px; font-size: 11.5px; color: var(--text-faint); flex-wrap: wrap; }

  /* casino promo strip */
  .promo-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 40px 0 14px; gap: 10px; }
  .promo-head h2 { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .promo-head .promo-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); animation: promoPulse 1.8s ease-in-out infinite; }
  @keyframes promoPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .promo-head p { margin: 3px 0 0; font-size: 11.5px; color: var(--text-faint); }
  .promo-see-all { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 12px; color: var(--green-hi); font-size: 11.5px; font-weight: 700; white-space: nowrap; transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease; }
  .promo-see-all:hover { border-color: rgba(139,92,246,0.5); color: #fff; background: var(--surface-2); }
  .promo-strip {
    display: flex; gap: 14px; overflow-x: auto; padding: 4px 16px 10px; scroll-snap-type: x proximity;
    margin: 0 -16px;
  }
  .promo-strip::-webkit-scrollbar { height: 6px; }
  .promo-card {
    scroll-snap-align: start; flex: 0 0 158px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border);
    background: var(--surface); transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease; cursor: pointer;
  }
  .promo-card:hover { transform: translateY(-4px) scale(1.015); border-color: rgba(139,92,246,0.55); box-shadow: 0 16px 36px -14px rgba(139,92,246,0.5); }
  .promo-card.disabled { cursor: default; }
  .promo-card.disabled:hover { transform: none; box-shadow: none; border-color: var(--border); }
  .promo-card-art {
    aspect-ratio: 1 / 1.08; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
    background-color: var(--surface-2); background-size: cover; background-position: center;
  }
  .promo-card-art::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(195deg, rgba(5,6,13,0) 38%, rgba(5,6,13,0.66) 100%);
  }
  .promo-card-icon-wrap {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 9px;
    background: rgba(5,6,13,0.4); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
  }
  .promo-card-kicker { position: relative; font-size: 9px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(255,255,255,0.72); }
  .promo-card-icon { position: absolute; top: 10px; right: 10px; font-size: 26px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }
  .promo-card-title { position: relative; font-size: 13.5px; font-weight: 800; color: #fff; line-height: 1.2; margin-top: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.35); }
  .promo-card-cta { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 9px 11px; font-size: 11px; color: var(--text-faint); border-top: 1px solid var(--border-soft); }
  .promo-card-cta .pc-status { display: flex; align-items: center; gap: 6px; }
  .promo-card-cta b { color: var(--green-hi); font-weight: 800; display: inline-flex; align-items: center; gap: 3px; transition: gap 0.15s ease; }
  .promo-card:hover .promo-card-cta b { gap: 6px; }
  .promo-card.disabled .promo-card-art { filter: grayscale(0.45) brightness(0.6); }
  .promo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); flex-shrink: 0; }
  .promo-dot.off { background: var(--text-faint); box-shadow: none; }
  .promo-dot.maintenance { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

  .grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 14px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card {
    position: relative; background: linear-gradient(175deg, var(--surface), var(--surface) 60%, #0d1712);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 17px; display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card::before {
    content: ""; position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
  }
  .card:hover { border-color: rgba(139,92,246,0.32); transform: translateY(-3px); box-shadow: 0 14px 28px -14px rgba(0,0,0,0.55), 0 0 0 1px rgba(139,92,246,0.06); }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-head-left { display: flex; align-items: flex-start; gap: 10px; }
  .cat-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; box-shadow: inset 0 0 0 1px var(--border-soft); }
  .card-title { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; line-height: 1.35; color: var(--text); letter-spacing: -0.005em; }

  .pct-row { display: flex; align-items: center; gap: 8px; }
  .pct { font-family: var(--font-mono); font-size: 23px; font-weight: 800; letter-spacing: -0.02em; }
  .pct-label { font-size: 11.5px; color: var(--text-faint); }

  .probbar { width: 100%; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px var(--border-soft); }
  .probbar > div { transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }

  .wager-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 4px 0 14px; }
  .wager-box.done { border-color: rgba(139,92,246,0.35); }
  .wager-head { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--text-dim); margin-bottom: 8px; }
  .wager-head strong { color: var(--green-hi); font-family: var(--font-mono); }
  .wager-bar { width: 100%; height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }
  .wager-bar > div { height: 100%; background: linear-gradient(90deg, var(--green-deep), var(--green)); border-radius: 4px; transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }
  .wager-bar.done > div { background: linear-gradient(90deg, var(--green-deep), var(--green)); }
  .wager-note { font-size: 11px; color: var(--text-faint); margin-top: 7px; line-height: 1.4; }
  .wager-note.done { color: var(--green); }

  .btn-row { display: flex; gap: 8px; margin-top: 2px; }
  .btn-yes, .btn-no {
    flex: 1; padding: 9px 0; border-radius: 9px; font-size: 12.5px; font-weight: 700;
    transition: background 0.12s ease, transform 0.06s ease, box-shadow 0.12s ease;
  }
  .btn-yes { background: var(--green-bg); color: var(--green-hi); border: 1px solid rgba(139,92,246,0.35); }
  .btn-yes:hover { background: var(--green); color: #150c2a; box-shadow: 0 4px 14px -4px rgba(139,92,246,0.5); }
  .btn-no { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,92,106,0.35); }
  .btn-no:hover { background: var(--red); color: #200609; box-shadow: 0 4px 14px -4px rgba(255,92,106,0.5); }
  .btn-yes:active, .btn-no:active { transform: scale(0.97); }

  .resolved-badge { text-align: center; padding: 9px 0; border-radius: 9px; font-size: 12.5px; font-weight: 700; }
  .resolved-badge.yes { background: var(--green-bg); color: var(--green-hi); }
  .resolved-badge.no { background: var(--red-bg); color: var(--red); }

  .card-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-faint); }

  .section-title {
    font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em;
    margin: 42px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: "◆"; color: var(--green); font-size: 8px; }
  .feed-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; height: 160px; overflow-y: auto; }
  .feed-line { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .feed-empty { font-size: 12.5px; color: var(--text-faint); }

  .disclaimer { text-align: center; margin-top: 32px; font-size: 11.5px; color: var(--text-faint); padding-bottom: 60px; line-height: 1.6; }

  /* auth */
  .auth-shell {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(ellipse 620px 420px at 50% 20%, rgba(139,92,246,0.10), transparent 65%);
  }
  .auth-card { width: 100%; max-width: 380px; background: linear-gradient(175deg, var(--surface), #0d1712); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6); }

  @keyframes bjTotalPop { 0% { transform: scale(0.7); opacity: 0.3; } 100% { transform: scale(1); opacity: 1; } }

  .mn-tile.mn-dim { opacity: 0.35; }
  .mn-tile.mn-fresh { animation: mnPop 0.3s cubic-bezier(.3,1.6,.4,1) both; }
  @keyframes mnPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .mn-tile.mn-mine.mn-fresh { animation: mnShake 0.4s ease both; }
  @keyframes mnShake {
    0% { transform: scale(0.5); }
    30% { transform: scale(1.15) rotate(-6deg); }
    55% { transform: scale(1) rotate(5deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* aviator — manche partagée en temps réel */
  .av-layout { display: flex; flex-direction: column; gap: 14px; }
  @media (min-width: 760px) { .av-layout { flex-direction: row; align-items: flex-start; } }
  .av-stage {
    position: relative; flex: 1; min-width: 0;
    background: radial-gradient(circle at 50% 0%, #1a1030 0%, #0a0b14 70%);
    border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 420px;
  }
  .av-history { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
  .av-history::-webkit-scrollbar { display: none; }
  .av-hist-chip { flex-shrink: 0; font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.05); }
  .av-graph-wrap { position: relative; flex: 1; min-height: 220px; display: flex; align-items: center; justify-content: center; }
  .av-graph-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .av-plane { position: absolute; font-size: 22px; transform: translate(-50%, -50%); filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); transition: opacity 0.2s ease; }
  .av-center { position: relative; z-index: 2; text-align: center; }
  .av-multiplier { font-family: var(--font-mono); font-size: 46px; font-weight: 800; color: #fff; text-shadow: 0 0 24px rgba(156,107,255,0.5); transition: color 0.2s ease; }
  .av-multiplier.av-crashed { color: var(--red); text-shadow: 0 0 24px rgba(255,77,94,0.5); }
  .av-multiplier.av-cashed { color: var(--green); }
  .av-phase-label { font-size: 12.5px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 6px; }
  .av-phase-label.av-waiting-label { color: var(--amber); }
  .av-countdown-bar { width: 180px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 10px auto 0; }
  .av-countdown-bar > div { height: 100%; background: var(--amber); transition: width 0.1s linear; }
  .av-players { border-top: 1px solid rgba(255,255,255,0.06); max-height: 180px; overflow-y: auto; flex-shrink: 0; }
  .av-players-head { display: grid; grid-template-columns: 1fr 70px 60px 70px; gap: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); padding: 8px 12px 4px; position: sticky; top: 0; background: #0d0e18; }
  .av-player-row { display: grid; grid-template-columns: 1fr 70px 60px 70px; gap: 6px; font-size: 12px; padding: 5px 12px; align-items: center; }
  .av-player-row.av-me { background: rgba(16,207,124,0.08); }
  .av-player-pseudo { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av-player-amount { font-family: var(--font-mono); color: var(--text-dim); }
  .av-player-mult { font-family: var(--font-mono); font-weight: 700; }
  .av-player-mult.av-out { color: var(--text-faint); }
  .av-player-gain { font-family: var(--font-mono); font-weight: 700; text-align: right; }
  .av-empty-players { padding: 14px 12px; font-size: 12px; color: var(--text-faint); text-align: center; }
  .av-auto-row { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
  .av-auto-row label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); flex-shrink: 0; }
  .av-auto-row input[type="number"] {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--font-mono); font-size: 13px; font-weight: 700; padding: 8px 10px; outline: none;
  }
  .av-auto-row input:disabled, .av-auto-row input[type="checkbox"]:disabled { opacity: 0.5; }
  .av-mybet-status { font-size: 11.5px; color: var(--text-dim); text-align: center; margin-top: 8px; line-height: 1.5; }
  .av-mybet-status.av-win { color: var(--green); font-weight: 700; }
  .av-mybet-status.av-lose { color: var(--red); font-weight: 700; }
  .av-btn-cashout { background: var(--amber) !important; color: #2b1c00 !important; border: none !important; }

  /* chicken road — habillage "Minecraft" (pixel-art, blocs, police pixel) */
  .ckr-mc {
    --mc-font: 'Press Start 2P', var(--font-mono);
    --mc-stone: #8b8b8b; --mc-stone-dk: #565656; --mc-stone-lt: #c6c6c6;
    --mc-dirt: #6a4a2f; --mc-dirt-lt: #8a6440; --mc-path: #9c7a4e; --mc-path-lt: #b6935f;
    --mc-grass: #5a9c3e; --mc-grass-dk: #3f7028; --mc-grass-lt: #79c455;
    --mc-emerald: #17c964; --mc-emerald-dk: #0d7a3c;
    --mc-gold: #f9c440; --mc-gold-dk: #b3860f;
    --mc-redstone: #d3271f; --mc-redstone-dk: #7a0f0b;
    --mc-oak: #a1682a; --mc-oak-dk: #6b4419; --mc-oak-panel: #b98a49;
    font-family: var(--mc-font);
    image-rendering: pixelated;
  }
  .ckr-mc, .ckr-mc input, .ckr-mc button { font-family: var(--mc-font); }
  .ckr-mc * { letter-spacing: 0; }

  .ckr-stage-card {
    background: var(--mc-stone); border: 4px solid #000; border-radius: 0; overflow: hidden; margin-bottom: 18px;
    box-shadow: inset 3px 3px 0 var(--mc-stone-lt), inset -3px -3px 0 var(--mc-stone-dk), 0 6px 0 rgba(0,0,0,0.5);
    image-rendering: pixelated;
  }
  .ckr-stage { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
  .ckr-stage::-webkit-scrollbar { display: none; height: 0; }
  .ckr-sidewalk {
    flex: 0 0 96px; height: 260px; position: relative; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 20px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 4px, transparent 4px 8px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.10) 0 4px, transparent 4px 8px),
      linear-gradient(var(--mc-grass), var(--mc-grass-dk));
    border-right: 4px solid #2b2b2b;
    box-shadow: inset 0 6px 0 var(--mc-grass-lt);
  }
  .ckr-sidewalk-tree {
    position: absolute; top: 2px; left: 14px; width: 32px; height: 48px;
    filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.35));
  }
  .ckr-sidewalk-tree svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
  .ckr-sidewalk-lamp {
    position: absolute; top: 30px; right: 20px; width: 8px; height: 54px; background: var(--mc-oak-dk);
    box-shadow: -2px 0 0 rgba(0,0,0,0.3);
  }
  .ckr-sidewalk-lamp::before {
    content: ""; position: absolute; top: -14px; left: -6px; width: 20px; height: 14px; background: #ffb238;
    box-shadow: 0 0 0 2px #402400, 0 0 10px 2px rgba(255,178,56,0.85);
  }
  .ckr-lanes {
    display: flex; align-items: stretch; min-width: max-content;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0 4px, transparent 4px 8px),
      linear-gradient(var(--mc-path-lt), var(--mc-path) 55%, var(--mc-dirt) 100%);
  }
  .ckr-lane {
    flex: 0 0 118px; height: 260px; position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding-top: 14px;
    border-right: 4px dashed #2b2b2b; background: transparent;
    box-shadow: inset -12px 0 12px -12px rgba(0,0,0,0.35);
    transition: background 0.25s ease;
  }
  .ckr-lane::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0,0,0,0.14) 2px, transparent 2px);
    background-size: 14px 14px; background-position: 3px 5px; pointer-events: none; opacity: 0.6;
  }
  .ckr-lane:last-child { border-right: none; }
  .ckr-lane.ckr-lane-passed { background: linear-gradient(rgba(23,201,100,0.16), rgba(23,201,100,0.05)); }
  .ckr-lane.ckr-lane-hit { background: linear-gradient(rgba(211,39,31,0.35), rgba(211,39,31,0.12)); }
  .ckr-vehicle { width: 46px; height: 46px; position: relative; z-index: 1; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.45)); transition: opacity 0.2s ease, filter 0.2s ease; image-rendering: pixelated; }
  .ckr-vehicle.ckr-vehicle-lg { width: 56px; height: 56px; }
  .ckr-vehicle svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
  .ckr-lane-passed .ckr-vehicle { opacity: 0.4; filter: grayscale(0.5) drop-shadow(2px 3px 0 rgba(0,0,0,0.3)); }
  .ckr-lane-hit .ckr-vehicle { opacity: 0; }
  .ckr-boom {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 52px; height: 52px;
    z-index: 2; animation: ckrBoom 0.4s steps(2) both;
  }
  .ckr-boom svg { width: 100%; height: 100%; shape-rendering: crispEdges; }
  @keyframes ckrBoom { 0% { transform: translateX(-50%) scale(0.4); opacity: 0; } 55% { transform: translateX(-50%) scale(1.3); opacity: 1; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
  .ckr-lane-grate-wrap { margin-top: auto; margin-bottom: 16px; display: flex; justify-content: center; }
  .ckr-grate {
    width: 56px; height: 56px; border-radius: 0; display: flex; align-items: center; justify-content: center;
    position: relative; border: 3px solid #1c1c1c;
    background: var(--mc-stone);
    box-shadow: inset 3px 3px 0 var(--mc-stone-lt), inset -3px -3px 0 var(--mc-stone-dk), 3px 3px 0 rgba(0,0,0,0.4);
    transition: all 0.25s ease;
  }
  .ckr-grate span { position: relative; z-index: 1; font-family: var(--mc-font); font-weight: 400; font-size: 10px; color: #f4f4f4; text-shadow: 1px 1px 0 rgba(0,0,0,0.7); }
  .ckr-grate.ckr-grate-passed {
    background: var(--mc-emerald);
    box-shadow: inset 3px 3px 0 #6bffb0, inset -3px -3px 0 var(--mc-emerald-dk), 3px 3px 0 rgba(0,0,0,0.4);
  }
  .ckr-grate.ckr-grate-passed span { color: #06331a; text-shadow: none; }
  .ckr-grate.ckr-grate-next {
    background: var(--mc-gold);
    box-shadow: inset 3px 3px 0 #ffe38a, inset -3px -3px 0 var(--mc-gold-dk), 3px 3px 0 rgba(0,0,0,0.4);
    animation: ckPulse 1s steps(2) infinite;
  }
  .ckr-grate.ckr-grate-next span { color: #4a3300; text-shadow: none; }
  .ckr-grate.ckr-grate-hit {
    background: var(--mc-redstone);
    box-shadow: inset 3px 3px 0 #ff8a83, inset -3px -3px 0 var(--mc-redstone-dk), 3px 3px 0 rgba(0,0,0,0.4);
  }
  @keyframes ckPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
  .ckr-chicken-slot { flex: 0 0 74px; height: 260px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 44px; position: relative; z-index: 2; }
  .ckr-chicken-slot svg { width: 52px; height: 52px; shape-rendering: crispEdges; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.45)); animation: ckBob 0.5s steps(2) infinite alternate; }
  .ckr-chicken-slot.ckr-chicken-hit svg { animation: none; opacity: 0.6; transform: rotate(80deg) translateY(6px); }
  @keyframes ckBob { from { transform: translateY(0); } to { transform: translateY(-5px); } }

  .ckr-banner { text-align: center; padding: 12px 16px 16px; font-family: var(--mc-font); font-size: 11px; line-height: 1.8; }

  .ckr-controls { display: grid; grid-template-columns: 1.1fr 1fr auto; gap: 14px; align-items: stretch; }
  @media (max-width: 760px) { .ckr-controls { grid-template-columns: 1fr; } }
  .ckr-box {
    background: var(--mc-oak-panel); border: 3px solid #000; border-radius: 0; padding: 14px;
    box-shadow: inset 3px 3px 0 rgba(255,255,255,0.25), inset -3px -3px 0 rgba(0,0,0,0.3);
  }
  .ckr-box-label { font-family: var(--mc-font); font-size: 9px; font-weight: 400; color: #2c1c07; text-transform: uppercase; margin-bottom: 10px; text-shadow: 1px 1px 0 rgba(255,255,255,0.2); }
  .ckr-bet-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .ckr-bet-row input {
    flex: 1; min-width: 0; background: #1c1c1c; border: 3px solid #000; border-radius: 0;
    box-shadow: inset 2px 2px 0 rgba(0,0,0,0.6), inset -1px -1px 0 rgba(255,255,255,0.08);
    color: #baf7c9; padding: 10px 8px; font-family: var(--mc-font); font-weight: 400; font-size: 13px; outline: none;
  }
  .ckr-minmax-btn {
    background: var(--mc-stone); border: 3px solid #000; border-radius: 0; padding: 0 12px;
    box-shadow: inset 2px 2px 0 var(--mc-stone-lt), inset -2px -2px 0 var(--mc-stone-dk);
    font-family: var(--mc-font); font-weight: 400; font-size: 9px; color: #1c1c1c;
  }
  .ckr-minmax-btn:active:not(:disabled) { box-shadow: inset 2px 2px 0 var(--mc-stone-dk), inset -2px -2px 0 var(--mc-stone-lt); }
  .ckr-minmax-btn:disabled, .ckr-bet-row input:disabled { opacity: 0.5; cursor: not-allowed; }
  .ckr-chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .ckr-mc .rl-chip-btn {
    background: var(--mc-emerald); border: 3px solid #000; border-radius: 0; color: #06331a;
    box-shadow: inset 2px 2px 0 #6bffb0, inset -2px -2px 0 var(--mc-emerald-dk);
    font-family: var(--mc-font); font-size: 10px; padding: 7px 9px;
  }
  .ckr-mc .rl-chip-btn:active:not(:disabled) { box-shadow: inset 2px 2px 0 var(--mc-emerald-dk), inset -2px -2px 0 #6bffb0; }
  .ckr-risk-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .ckr-risk-value { font-family: var(--mc-font); font-weight: 400; font-size: 11px; color: #7a2e00; }
  .ck-diff-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .ck-diff-btn {
    flex: 1; min-width: 64px; background: var(--mc-stone); border: 3px solid #000; border-radius: 0;
    box-shadow: inset 2px 2px 0 var(--mc-stone-lt), inset -2px -2px 0 var(--mc-stone-dk);
    padding: 9px 4px; color: #1c1c1c; font-family: var(--mc-font); font-weight: 400; font-size: 9px; cursor: pointer;
    transition: filter 0.1s ease;
  }
  .ck-diff-btn.active {
    background: var(--mc-gold);
    box-shadow: inset 2px 2px 0 #ffe38a, inset -2px -2px 0 var(--mc-gold-dk);
    color: #4a3300;
  }
  .ck-diff-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ckr-action-col { display: flex; flex-direction: column; gap: 10px; justify-content: center; min-width: 200px; }
  .ckr-play-btn {
    background: var(--mc-grass); color: #0e2a06; border: 3px solid #000; border-radius: 0; padding: 18px 20px;
    box-shadow: inset 3px 3px 0 var(--mc-grass-lt), inset -3px -3px 0 var(--mc-grass-dk), 3px 3px 0 rgba(0,0,0,0.4);
    font-family: var(--mc-font); font-weight: 400; font-size: 12px; cursor: pointer; transition: transform 0.06s ease;
  }
  .ckr-play-btn:hover:not(:disabled) { filter: brightness(1.08); }
  .ckr-play-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: inset 3px 3px 0 var(--mc-grass-dk), inset -3px -3px 0 var(--mc-grass-lt); }
  .ckr-play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ckr-cashout-btn {
    background: var(--mc-gold); color: #4a3300; border: 3px solid #000; border-radius: 0;
    box-shadow: inset 3px 3px 0 #ffe38a, inset -3px -3px 0 var(--mc-gold-dk), 3px 3px 0 rgba(0,0,0,0.4);
    padding: 13px 16px; font-family: var(--mc-font); font-weight: 400; font-size: 10.5px; cursor: pointer;
  }
  .ckr-cashout-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: inset 3px 3px 0 var(--mc-gold-dk), inset -3px -3px 0 #ffe38a; }
  .ckr-cashout-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ckr-howto-btn {
    display: flex; align-items: center; gap: 6px; background: var(--mc-stone); border: 3px solid #000; border-radius: 0;
    box-shadow: inset 2px 2px 0 var(--mc-stone-lt), inset -2px -2px 0 var(--mc-stone-dk);
    padding: 9px 12px; font-family: var(--mc-font); font-size: 9px; font-weight: 400; color: #1c1c1c;
  }
  .ckr-howto-btn:hover { filter: brightness(1.08); }
  .ckr-howto-panel {
    background: #2b2b2b; border: 3px solid #000; color: #d8d8d8;
    box-shadow: inset 3px 3px 0 rgba(255,255,255,0.08), inset -3px -3px 0 rgba(0,0,0,0.5);
    padding: 14px 16px; font-family: var(--mc-font); font-size: 10px; line-height: 2; margin-bottom: 14px;
  }

  /* flip */
  .cf-side-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .cf-side-btn {
    flex: 1; padding: 10px 0; border-radius: 8px; font-size: 12.5px; font-weight: 700;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .cf-side-btn:disabled { cursor: not-allowed; }
  .cf-side-btn.amber.active { background: var(--amber-bg); color: var(--amber); border-color: rgba(242,183,63,0.45); }
  .cf-side-btn.green.active { background: var(--green-bg); color: var(--green); border-color: rgba(16,207,124,0.45); }
  .cf-side-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .cf-side-dot.amber { background: var(--amber); }
  .cf-side-dot.green { background: var(--green); }
  .cf-side-icon { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }

  .cf-stage { display: flex; align-items: center; justify-content: center; padding: 30px 10px 10px; perspective: 900px; }
  .cf-coin {
    position: relative; width: 190px; height: 190px; border-radius: 50%;
    background: conic-gradient(from -40deg, #ffd875, var(--amber) 35%, #a3690f 65%, var(--amber) 90%, #ffd875);
    box-shadow: 0 10px 28px rgba(242,183,63,0.25), inset 0 0 0 2px rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    transform-style: preserve-3d;
  }
  .cf-coin.pile {
    background: conic-gradient(from -40deg, #7fe8b3, var(--green) 35%, #0a6b40 65%, var(--green) 90%, #7fe8b3);
    box-shadow: 0 10px 28px rgba(16,207,124,0.25), inset 0 0 0 2px rgba(255,255,255,0.08);
  }
  .cf-coin-hole {
    width: 64%; height: 64%; border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 14%;
  }
  .cf-coin-hole img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45)); }
  .cf-coin.spinning { animation: cfSpin 0.9s cubic-bezier(.4,.1,.3,1) both; }
  @keyframes cfSpin {
    0% { transform: rotateY(0deg) scale(1); }
    50% { transform: rotateY(900deg) scale(1.06); }
    100% { transform: rotateY(1440deg) scale(1); }
  }
  .cf-result-label { text-align: center; margin: 14px 0 0; font-size: 13.5px; font-weight: 700; }
  .cf-result-label.win { color: var(--green); }
  .cf-result-label.lose { color: var(--red); }

  .cf-history-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-top: 24px; }
  .cf-history-title { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .cf-history-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .cf-history-chip {
    width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .cf-history-chip img { width: 16px; height: 16px; object-fit: contain; }
  .cf-history-empty { font-size: 12px; color: var(--text-faint); }

  /* slots */
  .sl-stage { display: flex; flex-direction: column; align-items: center; padding: 30px 10px 6px; }
  .sl-reels { display: flex; gap: 12px; }
  .sl-reel {
    width: 74px; height: 74px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

// Barre de progression de l'exigence de mise ("wagering requirement") : tant
// qu'un joueur n'a pas remisé l'équivalent de ses dépôts approuvés, il ne
// peut pas retirer. required = 0 signifie "pas de dépôt en attente de mise",
// donc rien à afficher.
function wageringBarHtml(account) {
  const required = Number(account && account.wageringRequired) || 0;
  const progress = Math.min(Number(account && account.wageringProgress) || 0, required);
  if (required <= 0) return "";
  const pct = Math.round((progress / required) * 100);
  const done = progress >= required;
  const remaining = required - progress;
  return `
    <div class="wager-box ${done ? "done" : ""}">
      <div class="wager-head">
        <span>🎯 Objectif de mise avant retrait</span>
        <strong>${progress.toLocaleString("fr-FR")} / ${required.toLocaleString("fr-FR")} 💎</strong>
      </div>
      <div class="wager-bar ${done ? "done" : ""}"><div style="width:${pct}%;"></div></div>
      <p class="wager-note ${done ? "done" : ""}">
        ${done
          ? "✅ Objectif atteint, tu peux retirer."
          : `Il te reste à miser ${remaining.toLocaleString("fr-FR")} 💎 (sur des marchés ou au casino) avant de pouvoir retirer — un dépôt validé doit être remisé en totalité.`}
      </p>
    </div>
  `;
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

// Valeur "maintenant" au format attendu par <input type="datetime-local">
// (heure locale du navigateur, sans fuseau), ex: "2026-08-04T21:15"
function nowLocalInputValue() {
  const d = new Date();
  d.setSeconds(0, 0);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

// Retourne l'heure de fin choisie pour un marché (pré-remplie à "maintenant"
// si le staff n'a encore rien modifié), et la mémorise dans le state.
function getResolveTime(marketId) {
  if (!state.adminResolveTime[marketId]) {
    state.adminResolveTime[marketId] = nowLocalInputValue();
  }
  return state.adminResolveTime[marketId];
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
}

function sparkPoints(id, yes) {
  let seed = 0;
  for (let i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) % 997;
  const pts = [];
  let v = clamp(yes - 15 + (seed % 10), 5, 95);
  for (let i = 0; i < 8; i++) {
    seed = (seed * 53 + 7) % 997;
    v = clamp(v + (((seed % 21) - 10) * 0.9), 5, 95);
    pts.push(v);
  }
  pts.push(yes);
  return pts;
}
function sparklineSvg(id, yes) {
  const pts = sparkPoints(id, yes);
  const w = 64, h = 26;
  const step = w / (pts.length - 1);
  const path = pts.map((v, i) => `${i === 0 ? "M" : "L"} ${(i * step).toFixed(1)} ${(h - (v / 100) * h).toFixed(1)}`).join(" ");
  const up = pts[pts.length - 1] >= pts[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${up ? "var(--green)" : "var(--red)"}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/></svg>`;
}

/* ---------- client API : parle au backend Express ---------- */

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || "GET",
    headers: options.body instanceof FormData ? undefined : { "Content-Type": "application/json" },
    body: options.body instanceof FormData ? options.body : (options.body ? JSON.stringify(options.body) : undefined),
    credentials: "include",
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* pas de corps JSON */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `Erreur réseau (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ---------- image : compression avant envoi ---------- */

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read error"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image error"));
      img.onload = () => {
        const maxW = 1100;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
        canvas.toBlob(blob => resolve({ dataUrl, blob }), "image/jpeg", 0.78);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- boot ---------- */

async function loadEverything() {
  const [markets, feed, mybets, mydeposits, mywithdrawals, referrals] = await Promise.all([
    api("/api/markets"),
    api("/api/feed"),
    api("/api/mybets"),
    api("/api/mydeposits"),
    api("/api/mywithdrawals"),
    api("/api/referrals"),
  ]);
  state.markets = markets;
  state.feed = feed;
  state.mybets = mybets;
  state.deposits = mydeposits;
  state.withdrawals = mywithdrawals;
  state.referral = referrals;
}

async function boot() {
  // pré-remplit le code de parrainage depuis un lien du type /?ref=ABC123
  try {
    const urlRef = new URLSearchParams(window.location.search).get("ref");
    if (urlRef) state.referralCodeInput = urlRef.toUpperCase();
  } catch (e) { /* ignore */ }

  try {
    const me = await api("/api/me");
    state.account = me;
    await loadEverything();
    state.view = "app";
  } catch (e) {
    state.account = null;
    state.view = "auth";
  }
  state.booting = false;
  render();
}

/* ---------- market view helpers ---------- */

function visibleMarkets() {
  let list = state.filter === "all" ? state.markets : state.markets.filter(m => m.category === state.filter);
  if (state.query.trim()) {
    const q = state.query.trim().toLowerCase();
    list = list.filter(m => m.title.toLowerCase().includes(q));
  }
  const statusRank = { open: 0, locked: 1, resolved: 2 };
  return [...list].sort((a, b) => {
    if (a.status !== b.status) return statusRank[a.status] - statusRank[b.status];
    return b.volume - a.volume;
  });
}

async function placeBet() {
  if (!state.openBet || state.busy) return;
  const { marketId, side } = state.openBet;
  const stake = clamp(Math.round(state.amount), 10, state.account.balance);
  if (stake < 10 || stake > state.account.balance) { showToast("Mise invalide : pas assez d'émeraudes."); return; }

  state.busy = true; renderModal();
  try {
    const r = await api("/api/bets", { method: "POST", body: { marketId, side, amount: stake } });
    state.account.balance = r.balance;
    state.account.wageringRequired = r.wageringRequired;
    state.account.wageringProgress = r.wageringProgress;
    const [markets, feed, mybets] = await Promise.all([api("/api/markets"), api("/api/feed"), api("/api/mybets")]);
    state.markets = markets;
    state.feed = feed;
    state.mybets = mybets;
    showToast(`Mise placée : ${r.stake} 💎 sur "${side === "yes" ? "Oui" : "Non"}"`);
    closeBetModal();
  } catch (e) {
    showToast(e.message);
  }
  state.busy = false;
  render();
}

async function adminResolveMarket(marketId, outcome, resolvedAtLocal) {
  state.adminBusy = true; render();
  try {
    // L'input datetime-local donne une heure locale sans fuseau ("2026-08-04T21:15") ;
    // on la convertit en ISO (avec fuseau) pour que le serveur interprète la bonne heure.
    const resolvedAt = resolvedAtLocal ? new Date(resolvedAtLocal).toISOString() : new Date().toISOString();
    const r = await api(`/api/admin/markets/${marketId}/resolve`, { method: "POST", body: { outcome, resolvedAt } });
    const [markets, feed] = await Promise.all([api("/api/markets"), api("/api/feed")]);
    state.markets = markets;
    state.feed = feed;
    delete state.adminResolveTime[marketId];
    const refundMsg = r.refunded ? ` · ${r.refunded} pari(s) placé(s) après coup remboursé(s)` : "";
    showToast(`Marché résolu (${outcome === "yes" ? "Oui" : "Non"}) — ${r.paid} joueur(s) payé(s)${refundMsg}.`);
  } catch (e) {
    showToast(e.message);
  }
  state.adminBusy = false;
  render();
}

/* ---------- profil joueur ---------- */

function computeProfileStats() {
  const bets = state.mybets || [];
  let totalWagered = 0, wins = 0, losses = 0, pending = 0, refunded = 0, netProfit = 0, biggestWin = 0;
  bets.forEach(b => {
    totalWagered += b.amount;
    if (b.marketStatus !== "resolved") { pending++; return; }
    if (b.refunded) { refunded++; return; }
    if (b.marketResolution === b.side) {
      const payout = Math.round(b.amount * 100 / Math.max(1, b.price));
      const profit = payout - b.amount;
      wins++; netProfit += profit;
      if (profit > biggestWin) biggestWin = profit;
    } else {
      losses++; netProfit -= b.amount;
    }
  });
  const settled = wins + losses;
  const winRate = settled ? Math.round((wins / settled) * 100) : 0;
  return { totalBets: bets.length, totalWagered, wins, losses, pending, refunded, netProfit, biggestWin, winRate };
}

function profileFilteredBets() {
  const bets = [...(state.mybets || [])].sort((a, b) => b.ts - a.ts);
  const f = state.profileBetFilter || "all";
  if (f === "open") return bets.filter(b => b.marketStatus !== "resolved");
  if (f === "won") return bets.filter(b => b.marketStatus === "resolved" && !b.refunded && b.marketResolution === b.side);
  if (f === "lost") return bets.filter(b => b.marketStatus === "resolved" && !b.refunded && b.marketResolution !== b.side);
  return bets;
}

  let resultText, resultColor;

    resultText = "Remboursé"; resultColor = "var(--amber)";
  } else if (b.marketResolution === b.side) {

    resultText = `+${payout - b.amount} 💎`; resultColor = "var(--green-hi)";
  } else {
    resultText = `-${b.amount} 💎`; resultColor = "var(--red)";
  }
  const date = new Date(b.ts).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  return `
    <div class="profile-bet-row">

      <div style="flex:1; min-width:0;">

    </div>
  `;
}

    // l'animation de distribution pour des cartes déjà posées sur la table.
    state.bjAnim = s.active
      ? { playerCount: s.player.length, dealerHidden: s.dealer.map(c => !!c.hidden) }
      : { playerCount: 0, dealerHidden: [] };
  } catch (e) { /* ignore */ }
  state.bjJustResolved = false;
  render();
}

function bjSuitClass(s) { return (s === "♥" || s === "♦") ? "red" : ""; }

const BJ_DEAL_SLOT_MS = 260;   // pause entre chaque carte distribuée (suspense)
const BJ_BANNER_DELAY_MS = 380; // délai avant le bandeau de résultat, le temps que les dernières cartes se posent

// anim: "" | "bj-deal" | "bj-flip" — delaySlot: position dans la séquence de distribution (pour l'effet en cascade)
function bjCardHtml(c, anim, delaySlot) {
  const cls = anim ? ` ${anim}` : "";
  const style = anim ? ` style="--bj-delay:${(delaySlot || 0) * BJ_DEAL_SLOT_MS}ms"` : "";
  if (c.hidden) return `<div class="bj-card back${cls}"${style}></div>`;
  return `<div class="bj-card ${bjSuitClass(c.s)}${cls}"${style}><span>${c.r}</span><span class="bj-suit">${c.s}</span></div>`;
}

// Compare l'état précédemment affiché (state.bjAnim) à l'état actuel du jeu pour
// déterminer quelles cartes sont neuves (à faire "voler" sur la table) et laquelle
// vient d'être retournée (la carte cachée du croupier), puis met à jour le suivi.
function bjRenderHands(g) {
  const prevPlayerCount = state.bjAnim.playerCount || 0;
  const prevDealerHidden = state.bjAnim.dealerHidden || [];
  const prevDealerCount = prevDealerHidden.length;
  // le croupier retourne-t-il sa carte cachée sur ce rendu ? si oui, on laisse le
  // temps au retournement de se jouer avant de distribuer d'éventuelles cartes en plus
  const dealerFlips = prevDealerHidden[1] && g.dealer[1] && !g.dealer[1].hidden;

  const newPlayerIdxs = [];
  for (let i = prevPlayerCount; i < g.player.length; i++) newPlayerIdxs.push(i);
  const newDealerIdxs = [];
  for (let i = prevDealerCount; i < g.dealer.length; i++) newDealerIdxs.push(i);

  // distribution en alternance joueur/croupier, comme à une vraie table
  const playerDelay = {}, dealerDelay = {};
  let slot = dealerFlips ? 1 : 0, pi = 0, di = 0;
  while (pi < newPlayerIdxs.length || di < newDealerIdxs.length) {
    if (pi < newPlayerIdxs.length) { playerDelay[newPlayerIdxs[pi]] = slot++; pi++; }
    if (di < newDealerIdxs.length) { dealerDelay[newDealerIdxs[di]] = slot++; di++; }
  }

  const playerHtml = g.player.map((c, i) => {
    if (i in playerDelay) return bjCardHtml(c, "bj-deal", playerDelay[i]);
    return bjCardHtml(c, "", 0);
  }).join("");

  const dealerHtml = g.dealer.map((c, i) => {
    if (i in dealerDelay) return bjCardHtml(c, "bj-deal", dealerDelay[i]);
    if (prevDealerHidden[i] && !c.hidden) return bjCardHtml(c, "bj-flip", 0);
    return bjCardHtml(c, "", 0);
  }).join("");

  state.bjAnim.playerCount = g.player.length;
  state.bjAnim.dealerHidden = g.dealer.map(c => !!c.hidden);

  return { playerHtml, dealerHtml };
}

function bjParticlesHtml(result) {
  if (result !== "win" && result !== "blackjack") return "";
  const emojis = result === "blackjack" ? ["🂡", "✨", "💎", "🔥", "✨"] : ["✨", "💎", "🎉", "✨", "💎"];
  return `<div class="bj-particles">${emojis.map((e, i) =>
    `<span class="bj-particle" style="--dx:${Math.round((i - (emojis.length - 1) / 2) * 24)}px; --bj-pdelay:${BJ_BANNER_DELAY_MS + i * 90}ms;">${e}</span>`
  ).join("")}</div>`;
}

async function bjAction(path, body) {
  if (state.bjBusy) return;
  if (path === "start") state.bjAnim = { playerCount: 0, dealerHidden: [] };
  state.bjBusy = true; state.bjError = ""; render();
  const prevStatus = state.blackjack ? state.blackjack.status : null;
  try {
    const r = await api(`/api/casino/blackjack/${path}`, { method: "POST", body });
    state.account.balance = r.balance;
    state.account.wageringRequired = r.wageringRequired;
    state.account.wageringProgress = r.wageringProgress;
    state.blackjack = r;
    state.bjJustResolved = prevStatus !== "finished" && r.status === "finished";
  } catch (e) {
    state.bjError = e.message;
  }
  state.bjBusy = false;
  render();
}

  bjAction("start", { amount });
}

// Construit la grille : compare aux cases déjà affichées lors du rendu précédent
// (state.minesAnim) pour savoir lesquelles viennent d'être révélées (animation
// "mn-fresh"), puis met à jour ce suivi pour le prochain rendu.
function minesRenderTiles(g) {
  const prevRevealed = state.minesAnim || new Set();
  const revealedSet = new Set(g ? g.revealed : []);
  const finished = g && g.status !== "playing";
  const minesSet = new Set(finished ? g.mines : []);

  const html = Array.from({ length: MINES_GRID_SIZE_CLIENT }, (_, i) => {
    let cls = "mn-tile";
    let inner = "";
    const isRevealed = revealedSet.has(i);
    const isFresh = isRevealed && !prevRevealed.has(i);
    const clickable = g && g.status === "playing" && !isRevealed && !state.minesBusy;

    if (isRevealed) {
      if (minesSet.has(i)) { cls += ` mn-mine${isFresh ? " mn-fresh" : ""}`; inner = `<img src="${MINES_BOMB_URL}" alt="bombe" />`; }
      else { cls += ` mn-gem${isFresh ? " mn-fresh" : ""}`; inner = `<img src="${MINES_GEM_URL}" alt="gemme" />`; }
    } else if (finished && minesSet.has(i)) {
      cls += " mn-mine mn-dim"; inner = `<img src="${MINES_BOMB_URL}" alt="bombe" />`;
    }
    return `<button class="${cls}" data-tile="${i}" ${clickable ? "" : "disabled"}>${inner}</button>`;
  }).join("");

  state.minesAnim = revealedSet;
  return html;
}

// Construit la scène : trottoir de départ, puis une ligne de route par palier
// (véhicule décoratif en haut, plaque d'égout affichant le multiplicateur en
// bas), avec le poulet inséré juste avant la prochaine ligne à tenter (ou
// juste avant la ligne fatale s'il vient de se faire renverser).
function chickenRenderScene(g) {
  const maxSteps = g ? g.maxSteps : 15;
  const lanes = g ? g.lanes : Array.from({ length: maxSteps }, (_, i) => (1 + i * 0.1).toFixed(2));
  const step = g ? g.step : 0; // nb de lignes franchies avec succès (inchangé si renversé sur la suivante)
  const finished = g && g.status !== "playing";
  const hitLane = g && g.status === "lost" ? step : -1; // ligne (0-indexée) où le poulet s'est fait renversé

  const chickenSlot = (hit) => `<div class="ckr-chicken-slot${hit ? " ckr-chicken-hit" : ""}">${CHICKEN_SVG}</div>`;

  const laneHtml = (i) => {
    const passed = g && i < step;
    const isHit = i === hitLane;
    const isNext = g && !finished && i === step;
    const v = CHICKEN_MOB_PALETTE[i % CHICKEN_MOB_PALETTE.length];

    let laneCls = "ckr-lane";
    if (passed) laneCls += " ckr-lane-passed";
    if (isHit) laneCls += " ckr-lane-hit";

    let grateCls = "ckr-grate";
    if (passed) grateCls += " ckr-grate-passed";
    if (isNext) grateCls += " ckr-grate-next";
    if (isHit) grateCls += " ckr-grate-hit";

    const vehicleHtml = isHit
      ? `<div class="ckr-vehicle${v.lg ? " ckr-vehicle-lg" : ""}">${v.svg}</div><div class="ckr-boom">${CHICKEN_BOOM_SVG}</div>`
      : `<div class="ckr-vehicle${v.lg ? " ckr-vehicle-lg" : ""}">${v.svg}</div>`;

    return `
      <div class="${laneCls}" data-lane="${i}">
        ${vehicleHtml}
        <div class="ckr-lane-grate-wrap"><div class="${grateCls}"><span>${Number(lanes[i]).toFixed(2)}×</span></div></div>
      </div>
    `;
  };

  const chickenPos = step; // le poulet se tient juste avant la ligne "step" (0..maxSteps)
  const parts = [];
  for (let i = 0; i < maxSteps; i++) {
    if (i === chickenPos) parts.push(chickenSlot(hitLane === i));
    parts.push(laneHtml(i));
  }
  if (chickenPos >= maxSteps) parts.push(chickenSlot(false));

  return `
    <div class="ckr-sidewalk">
      <div class="ckr-sidewalk-tree">${CHICKEN_TREE_SVG}</div>
      <div class="ckr-sidewalk-lamp"></div>
    </div>
    <div class="ckr-lanes">${parts.join("")}</div>
  `;
}

  // Étape 1 (synchrone, avant tout repaint) : on restaure la position qu'avait l'ancienne scène,
  // pour ne jamais laisser le navigateur peindre un retour au début.
  // Étape 2 (si le step a changé) : on anime en douceur depuis cette position restaurée vers la
  // nouvelle position du poulet — via getBoundingClientRect (fiable quel que soit le scroll en cours).
  const stage = document.getElementById("ckrStage");

    stage.scrollLeft = savedScrollLeft;
    const currentStep = g ? g.step : 0;

      state.chickenAnim = currentStep;
      requestAnimationFrame(() => {
        const liveStage = document.getElementById("ckrStage");
        const chickenEl = liveStage && liveStage.querySelector(".ckr-chicken-slot");
        if (liveStage && chickenEl) {
          const stageRect = liveStage.getBoundingClientRect();
          const chickenRect = chickenEl.getBoundingClientRect();
          const target = liveStage.scrollLeft + (chickenRect.left - stageRect.left) - stageRect.width / 2 + chickenRect.width / 2;
          liveStage.scrollTo({ left: Math.max(0, target), behavior: "smooth" });
        }
      });
    }
  }
}

  if (spinBtn) spinBtn.addEventListener("click", slotsStart);

  // Pendant l'animation, on fait défiler des symboles aléatoires dans chaque
  // rouleau à intervalle rapide pour donner l'illusion d'un vrai tirage,
  // jusqu'à ce que le résultat final (déjà connu du serveur) soit révélé.
  if (spinning) {
    const reelEls = document.querySelectorAll(".sl-reel .sl-symbol");
    let n = 0;
    const iv = setInterval(() => {
      if (!state.slotsSpinning) { clearInterval(iv); return; }
      n++;
      reelEls.forEach((el, i) => {
        el.textContent = SLOTS_SPIN_SYMBOLS[(n + i * 2) % SLOTS_SPIN_SYMBOLS.length];
      });
    }, 80);
  }
}

let AVIATOR_MIN_BET_CLIENT = 10; // valeur par défaut, écrasée par /api/casino/status au chargement du casino
let AVIATOR_MAX_BET_CLIENT = null; // idem — null = pas de plafond
const AVIATOR_GROWTH_K_CLIENT = Math.log(2) / 6; // doit être identique à AVIATOR_GROWTH_K côté serveur
const AVIATOR_POLL_MS = 350; // fréquence de rafraîchissement de l'état de la manche (joueurs, phase, historique)

function avFmt(centsOrX, isCents = true) {
  const x = isCents ? centsOrX / 100 : centsOrX;
  return `${x.toFixed(2)}×`;
}
function avHistColor(cents) {
  const x = cents / 100;
  if (x >= 10) return "#ff5fd1";
  if (x >= 2) return "#9c6bff";
  return "#4fb3ff";
}

async function openAviator() {
  state.casinoGame = "aviator";
  state.aviatorError = "";
  state.aviator = null;
  render();
  await aviatorPoll();
  clearInterval(state.aviatorPollTimer);
  state.aviatorPollTimer = setInterval(aviatorPoll, AVIATOR_POLL_MS);
}

function aviatorStopLoops() {
  clearInterval(state.aviatorPollTimer);
  state.aviatorPollTimer = null;
  if (state.aviatorRafId) cancelAnimationFrame(state.aviatorRafId);
  state.aviatorRafId = null;
}

async function aviatorPoll() {
  if (state.casinoGame !== "aviator") { aviatorStopLoops(); return; }
  try {
    const s = await api("/api/casino/aviator/state");
    if (state.casinoGame !== "aviator") { aviatorStopLoops(); return; }
    const prevPhase = state.aviator ? state.aviator.phase : null;
    state.aviator = s;
    if (!document.getElementById("avStage") || prevPhase !== s.phase) {
      render();
    } else {
      aviatorPatchDom();
    }
    if (s.phase === "flying" && !state.aviatorRafId) {
      state.aviatorRafId = requestAnimationFrame(aviatorRafTick);
    }
    if (s.phase !== "flying" && state.aviatorRafId) {
      cancelAnimationFrame(state.aviatorRafId);
      state.aviatorRafId = null;
    }
  } catch (e) { /* on ignore les ratés ponctuels de polling */ }
}

// Boucle d'animation fluide (60fps) pendant le vol : recalcule le
// multiplicateur/la courbe à partir de flightStartedAt (formule identique au
// serveur), sans attendre le prochain polling — le point de crash n'étant
// jamais connu à l'avance côté client, ça ne triche pas, ça lisse juste
// l'affichage entre deux rafraîchissements de l'état.
function aviatorRafTick() {
  if (state.casinoGame !== "aviator" || !state.aviator || state.aviator.phase !== "flying") {
    state.aviatorRafId = null;
    return;
  }
  const elapsedSec = (Date.now() - state.aviator.flightStartedAt) / 1000;
  const liveMultCents = Math.floor(Math.exp(AVIATOR_GROWTH_K_CLIENT * Math.max(0, elapsedSec)) * 100);
  avRenderMultiplier(liveMultCents, elapsedSec);
  state.aviatorRafId = requestAnimationFrame(aviatorRafTick);
}

function avRenderMultiplier(cents, elapsedSec) {
  const el = document.getElementById("avMultiplier");
  if (el) el.textContent = avFmt(cents);
  avDrawGraph(elapsedSec, cents);
  const myBet = state.aviator && state.aviator.myBet;
  const cashoutBtn = document.getElementById("avActionBtn");
  if (cashoutBtn && myBet && myBet.cashedOutAt == null) {
    cashoutBtn.textContent = `Encaisser — ${Math.round((myBet.amount * cents) / 100)} 💎`;
  }
}

function avDrawGraph(elapsedSec, currentCents) {
  const path = document.getElementById("avGraphPath");
  const plane = document.getElementById("avPlane");
  if (!path) return;
  const W = 600, H = 240, PAD = 16;
  const t = Math.max(0.4, elapsedSec);
  const xMax = t * 1.15;
  const yMax = Math.max(2, (currentCents / 100) * 1.2);
  const N = 40;
  let d = "";
  let lastX = PAD, lastY = H - PAD;
  for (let i = 0; i <= N; i++) {
    const ti = (t * i) / N;
    const m = Math.exp(AVIATOR_GROWTH_K_CLIENT * ti);
    const x = PAD + (ti / xMax) * (W - 2 * PAD);
    const y = (H - PAD) - (Math.log(m) / Math.log(yMax)) * (H - 2 * PAD);
    d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    lastX = x; lastY = y;
  }
  path.setAttribute("d", d);
  const fill = document.getElementById("avGraphFill");
  if (fill) fill.setAttribute("d", d + `L ${lastX.toFixed(1)} ${H - PAD} L ${PAD} ${H - PAD} Z`);
  if (plane) {
    plane.style.left = `${(lastX / W) * 100}%`;
    plane.style.top = `${(lastY / H) * 100}%`;
  }
}

async function aviatorAction(path, body) {

function aviatorPatchDom() {

    if (countdownFill) countdownFill.style.width = `${clamp((remain / 7000) * 100, 0, 100)}%`;

  const btn = document.getElementById("avActionBtn");

  if (btn) {

      else { btn.textContent = state.aviatorBusy ? "…" : "🚀 Miser"; if (state.account.balance < AVIATOR_MIN_BET_CLIENT) btn.disabled = true; }
    } else if (s.phase === "flying") {
      if (s.myBet && s.myBet.cashedOutAt == null) { btn.textContent = `Encaisser — ${Math.round((s.myBet.amount * s.multiplier) / 100)} 💎`; btn.className = "bj-btn primary bj-bet-btn av-btn-cashout"; }
      else { btn.textContent = s.myBet ? "Encaissé ✓" : "En attente…"; btn.disabled = true; }
    } else {

  if (statusEl) {

      statusEl.className = "av-mybet-status av-win";
      statusEl.textContent = `🎉 Encaissé à ${avFmt(s.myBet.cashedOutAt)} — gain net +${s.myBet.payout - s.myBet.amount} 💎`;

      statusEl.textContent = "";

  }

  if (s.phase !== "flying") {
    avDrawGraph(s.phase === "waiting" ? 0.4 : 6, s.phase === "waiting" ? 100 : s.crashPoint);
  }
}

/* ---------- casino : roulette ---------- */

let ROULETTE_MIN_BET_CLIENT = 10; // valeur par défaut, écrasée par /api/casino/status au chargement du casino
let ROULETTE_MAX_BET_CLIENT = null; // idem — null = pas de plafond
const ROULETTE_RED_CLIENT = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
const ROULETTE_CHIPS = [10, 50, 100, 500, 1000];

// Ordre réel des cases sur une roue européenne (37 cases, un seul 0). Sert à
// positionner les numéros autour de la roue ET à calculer l'angle exact vers
// lequel elle doit tourner pour s'arrêter sur le numéro tiré par le serveur.
const ROULETTE_WHEEL_ORDER = [
  0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5,
  24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26,
];
const ROULETTE_WHEEL_SEG = 360 / ROULETTE_WHEEL_ORDER.length;

function rouletteNumColor(n) {
  if (n === 0) return "green";
  return ROULETTE_RED_CLIENT.has(n) ? "red" : "black";
}

// Dégradé conique représentant les 37 cases colorées de la roue, dans l'ordre
// réel de la roue (pas l'ordre numérique). `conic-gradient` démarre à midi et
// tourne dans le sens horaire par défaut — exactement ce qu'il faut pour que
// nos calculs d'angle (rouletteTargetAngle) restent cohérents avec le rendu.
function rouletteWheelGradient() {
  const seg = 100 / ROULETTE_WHEEL_ORDER.length;
  const stops = ROULETTE_WHEEL_ORDER.map((n, i) => {
    const color = n === 0 ? "#0a8a52" : (ROULETTE_RED_CLIENT.has(n) ? "#c81e3a" : "#181920");
    return `${color} ${(i * seg).toFixed(4)}% ${((i + 1) * seg).toFixed(4)}%`;
  });
  return `conic-gradient(${stops.join(", ")})`;
}

function rouletteWheelNumbersHtml() {
  return ROULETTE_WHEEL_ORDER.map((n, i) => {
    const angle = (i + 0.5) * ROULETTE_WHEEL_SEG;
    return `<div class="rl-wheel-num-lbl" style="transform: rotate(${angle}deg) translateY(-85px);">${n}</div>`;
  }).join("");
}

// Angle (en degrés) auquel il faut amener la roue pour que le numéro tiré se
// retrouve exactement sous le repère fixe en haut (le pointeur doré).
function rouletteTargetAngleForPocket(pocket) {
  const idx = ROULETTE_WHEEL_ORDER.indexOf(pocket);
  const wedgeCenter = (idx + 0.5) * ROULETTE_WHEEL_SEG;
  return (360 - wedgeCenter) % 360;
}

async function openRoulette() {
  state.casinoGame = "roulette";
  state.rouletteError = "";
  state.rouletteSpinning = false;
  state.rouletteSpinAnim = null;
  state.rouletteBets = [];
  render();
  try {
    const s = await api("/api/casino/roulette/state");
    state.rouletteHistory = s.history || [];
  } catch (e) { /* pas d'historique, on part d'un état vide */ }
  render();
}

function rouletteTotalBets() {
  return state.rouletteBets.reduce((sum, b) => sum + b.amount, 0);
}

// Ajoute une mise sur une case (numéro plein ou chance/douzaine/colonne) avec
// le jeton actuellement sélectionné. Si une mise existe déjà sur cette même
// case, on empile le jeton dessus (comme sur une vraie table).
function rouletteAddBet(type, value, label) {
  if (state.rouletteBusy || state.rouletteSpinning) return;
  const chip = state.rouletteChip;
  const available = (state.account.balance || 0) - rouletteTotalBets();
  if (chip > available) { showToast("Solde insuffisant pour ce jeton."); return; }

  const existing = state.rouletteBets.find(b => b.type === type && b.value === value);
  if (existing) existing.amount += chip;
  else state.rouletteBets.push({ type, value, amount: chip, label });
  render();
}

function rouletteUndoBet() {
  if (state.rouletteBusy || state.rouletteSpinning) return;
  state.rouletteBets.pop();
  render();
}

function rouletteClearBets() {
  if (state.rouletteBusy || state.rouletteSpinning) return;
  state.rouletteBets = [];
  render();
}

const ROULETTE_SPIN_MS = 2600;

function rouletteSpin() {
  if (state.rouletteBusy || state.rouletteSpinning || state.rouletteBets.length === 0) return;
  state.rouletteBusy = true; state.rouletteError = ""; render();

  (async () => {
    try {
      const bets = state.rouletteBets.map(b => ({ type: b.type, value: b.value, amount: b.amount }));
      const r = await api("/api/casino/roulette/play", { method: "POST", body: { bets } });

      // Calcule la rotation à appliquer : on part de la position actuelle de
      // la roue, on ajoute plusieurs tours complets pour l'effet, et on
      // termine pile sur le numéro renvoyé par le serveur.
      const from = state.rouletteWheelRotation || 0;
      const desiredMod = rouletteTargetAngleForPocket(r.pocket);
      let to = from - (from % 360) + 360 * 5 + desiredMod;
      if (to <= from) to += 360;
      state.rouletteSpinAnim = { from, to };
      state.rouletteSpinning = true;
      render();

      setTimeout(() => {
        state.account.balance = r.balance;
        state.account.wageringRequired = r.wageringRequired;
        state.account.wageringProgress = r.wageringProgress;
        state.roulette = r;
        state.rouletteHistory = r.history || [];
        state.rouletteBets = [];
        state.rouletteWheelRotation = state.rouletteSpinAnim.to;
        state.rouletteSpinAnim = null;
        state.rouletteSpinning = false;
        state.rouletteBusy = false;
        render();
      }, ROULETTE_SPIN_MS);
    } catch (e) {
      state.rouletteError = e.message;
      state.rouletteBusy = false;
      render();
    }

}

// Reconstruit la vraie grille d'une table de roulette : 0 sur 3 lignes à
// gauche, les 36 numéros répartis en 3 lignes × 12 colonnes (colonne c =
// numéros 3c-2 / 3c-1 / 3c), les mises "colonne" (2:1) au bout de chaque
// ligne, puis les douzaines et les chances simples en dessous.
function rouletteTableHtml(disabled) {
  const cells = [];

  cells.push(`<button class="rl-cell zero" style="grid-row:1/4; grid-column:1;" data-rl-straight="0" ${disabled ? "disabled" : ""}>0${(() => {
    const b = state.rouletteBets.find(x => x.type === "straight" && x.value === 0);
    return b ? `<span class="rl-chip-badge">${b.amount}</span>` : "";
  })()}</button>`);

  for (let c = 1; c <= 12; c++) {
    const top = 3 * c, mid = 3 * c - 1, bot = 3 * c - 2;
    [[top, 1], [mid, 2], [bot, 3]].forEach(([n, row]) => {
      const b = state.rouletteBets.find(x => x.type === "straight" && x.value === n);
      cells.push(`
        <button class="rl-cell ${rouletteNumColor(n)}" style="grid-row:${row}; grid-column:${c + 1};" data-rl-straight="${n}" ${disabled ? "disabled" : ""}>
          ${n}${b ? `<span class="rl-chip-badge">${b.amount}</span>` : ""}
        </button>
      `);
    });
  }

  // colonnes 2:1 — la ligne du haut correspond à la colonne 3 (3,6,9…36), celle
  // du milieu à la colonne 2, celle du bas à la colonne 1 (1,4,7…34).
  [[1, 3], [2, 2], [3, 1]].forEach(([row, colValue]) => {
    const b = state.rouletteBets.find(x => x.type === "column" && x.value === colValue);
    cells.push(`
      <button class="rl-cell colbet" style="grid-row:${row}; grid-column:14;" data-rl-outside="column" data-rl-value="${colValue}" ${disabled ? "disabled" : ""}>
        2:1${b ? `<span class="rl-chip-badge">${b.amount}</span>` : ""}
      </button>
    `);
  });

  const dozens = [[1, "2 / span 4", "1 à 12"], [2, "6 / span 4", "13 à 24"], [3, "10 / span 4", "25 à 36"]];
  dozens.forEach(([value, colSpan]) => {
    const b = state.rouletteBets.find(x => x.type === "dozen" && x.value === value);
    cells.push(`
      <button class="rl-cell colbet" style="grid-row:4; grid-column:${colSpan};" data-rl-outside="dozen" data-rl-value="${value}" ${disabled ? "disabled" : ""}>
        ${["1ère", "2ème", "3ème"][value - 1]} douzaine (${["1-12", "13-24", "25-36"][value - 1]})${b ? `<span class="rl-chip-badge">${b.amount}</span>` : ""}
      </button>
    `);
  });

  const outside = [
    ["low", null, "2 / span 2", "1 à 18", ""],
    ["even", null, "4 / span 2", "Pair", ""],
    ["red", null, "6 / span 2", "Rouge", "red-fill"],
    ["black", null, "8 / span 2", "Noir", "black-fill"],
    ["odd", null, "10 / span 2", "Impair", ""],
    ["high", null, "12 / span 2", "19 à 36", ""],
  ];
  outside.forEach(([type, value, colSpan, label, extra]) => {
    const b = state.rouletteBets.find(x => x.type === type && x.value === value);
    cells.push(`
      <button class="rl-cell outside ${extra}" style="grid-row:5; grid-column:${colSpan};" data-rl-outside="${type}" data-rl-value="" ${disabled ? "disabled" : ""}>
        ${label}${b ? `<span class="rl-chip-badge">${b.amount}</span>` : ""}
      </button>
    `);
  });

  return cells.join("");
}

      rouletteAddBet(type, value, label);

      rouletteAddBet(type, null, outsideLabels[type]);

  const clearBtn = document.getElementById("rlClearBtn");
  if (clearBtn) clearBtn.addEventListener("click", rouletteClearBets);

}

function renderModal() {
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  if (state.depositModalOpen) { renderDepositModalContent(overlay, modal); return; }
  if (state.withdrawModalOpen) { renderWithdrawModalContent(overlay, modal); return; }
  if (state.referralModalOpen) { renderReferralModalContent(overlay, modal); return; }
  if (state.faqModalOpen) { renderFaqModalContent(overlay, modal); return; }
  if (state.legalModalOpen) { renderLegalModalContent(overlay, modal); return; }
  if (!state.openBet) { overlay.classList.remove("open"); return; }

  const market = state.markets.find(m => m.id === state.openBet.marketId);
  if (!market || market.status !== "open") { closeBetModal(); return; }
  const isYes = state.openBet.side === "yes";
  const balance = state.account.balance;
  const price = isYes ? market.yes : (100 - market.yes);
  const potential = Math.round(state.amount * 100 / Math.max(2, price));
  const quicks = [10, 50, 100, Math.max(10, balance)];

  modal.innerHTML = `
    <div class="modal-head">
      <span class="modal-kicker" style="color:${isYes ? "var(--green)" : "var(--red)"};">Mise sur "${isYes ? "Oui" : "Non"}"</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <p class="modal-title">${esc(market.title)}</p>
    <label class="modal-label">Montant · ${balance} 💎 disponibles</label>
    <div class="amount-row">
      <span style="font-family:var(--font-mono); font-size:15px; color:var(--text-faint);">💎</span>
      <input type="number" id="amountInput" min="10" max="${Math.max(10, balance)}" value="${state.amount}" />
    </div>
    <div class="quick-row">
      ${quicks.map((q, i) => `<button class="quick-btn" data-quick="${q}">${i === 3 ? "Max" : q}</button>`).join("")}
    </div>
    <button class="confirm-btn ${isYes ? "btn-yes" : "btn-no"}" id="confirmBtn" ${state.busy || balance < 10 ? "disabled style='opacity:0.55;'" : ""}>
      ${state.busy ? "Confirmation…" : "Confirmer la mise"}
    </button>
    <p class="price-note">Si "${isYes ? "Oui" : "Non"}" l'emporte, tu recevrais environ ${potential} 💎.</p>
    ${balance < 10 ? `<p class="low-balance">Solde insuffisant pour parier. Reviens demain pour ton bonus quotidien.</p>` : ""}
  `;

  overlay.classList.add("open");
  overlay.onclick = (e) => { if (e.target === overlay) closeBetModal(); };
  document.getElementById("modalClose").addEventListener("click", closeBetModal);
  const amountInput = document.getElementById("amountInput");
  amountInput.addEventListener("input", e => {
    state.amount = clamp(Math.round(Number(e.target.value) || 10), 10, Math.max(10, balance));
    renderModal();
  });
  document.querySelectorAll("[data-quick]").forEach(b => b.addEventListener("click", () => {
    state.amount = clamp(Number(b.dataset.quick), 10, Math.max(10, balance));
    renderModal();
  }));
  const confirmBtn = document.getElementById("confirmBtn");
  if (confirmBtn) confirmBtn.addEventListener("click", placeBet);
}

  }));
  document.querySelectorAll("[data-approve-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Confirmer que tu as bien remis les émeraudes en jeu à ce joueur ?")) {
      adminApproveWithdrawal(b.dataset.approveWd);
    }
  }));
  document.querySelectorAll("[data-reject-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Refuser cette demande de retrait ? Le solde du joueur sera recrédité.")) {
      adminRejectWithdrawal(b.dataset.rejectWd);
    }
  }));
  document.querySelectorAll("[data-delete-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Supprimer cet historique de retrait ?")) adminDeleteWithdrawal(b.dataset.deleteWd);
  }));
  document.querySelectorAll("[data-viewshot]").forEach(el => el.addEventListener("click", () => {
    const dep = state.deposits.find(d => d.id === Number(el.dataset.viewshot) || d.id === el.dataset.viewshot);
    if (dep) viewScreenshotFull(dep.screenshot);
  }));
  document.querySelectorAll("[data-set-balance]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.setBalance;
    const input = document.querySelector(`[data-balance-input="${id}"]`);
    const value = input ? input.value : "";
    if (!confirm(`Fixer le solde de ce joueur à ${value} 💎 ?`)) return;
    adminSetBalance(id, "balance", value);
  }));
  document.querySelectorAll("[data-adjust-balance]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.adjustBalance;
    const input = document.querySelector(`[data-delta-input="${id}"]`);
    const value = input ? input.value : "";
    adminSetBalance(id, "delta", value);
  }));
  document.querySelectorAll("[data-save-limit]").forEach(b => b.addEventListener("click", () => {
    const game = b.dataset.saveLimit;
    const minInput = document.querySelector(`[data-limit-min="${game}"]`);
    const maxInput = document.querySelector(`[data-limit-max="${game}"]`);
    const minBet = minInput ? minInput.value : "";
    const maxBet = maxInput ? maxInput.value : "";
    adminSetCasinoLimit(game, minBet, maxBet);
  }));
  document.querySelectorAll("[data-toggle-account]").forEach(el => el.addEventListener("click", () => {
    toggleAccountBets(el.dataset.toggleAccount);
  }));
  document.querySelectorAll("[data-toggle-account-casino]").forEach(el => el.addEventListener("click", () => {
    toggleAccountCasinoBets(el.dataset.toggleAccountCasino);
  }));
}

/* ---------- boot ---------- */

// Bandeau de prévention jeu responsable : fermable pour la session en cours
// (il n'est pas dans #app donc pas touché par render(), un seul listener suffit).
const jisBannerClose = document.getElementById("jisBannerClose");
if (jisBannerClose) jisBannerClose.addEventListener("click", () => {
  document.body.classList.add("jis-banner-hidden");
});

boot();
</script>
</body>
</html>
