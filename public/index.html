/* ---------- helpers ---------- */

function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
}

function sparkPoints(id, yes) {
  let seed = 0;
  for (let i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) % 997;
  const pts = [];
  let v = clamp(yes - 15 + (seed % 10), 5, 95);
  for (let i = 0; i < 8; i++) {
    seed = (seed * 53 + 7) % 997;
    v = clamp(v + (((seed % 21) - 10) * 0.9), 5, 95);
    pts.push(v);
  }
  pts.push(yes);
  return pts;
}
function sparklineSvg(id, yes) {
  const pts = sparkPoints(id, yes);
  const w = 64, h = 26;
  const step = w / (pts.length - 1);
  const path = pts.map((v, i) => `${i === 0 ? "M" : "L"} ${(i * step).toFixed(1)} ${(h - (v / 100) * h).toFixed(1)}`).join(" ");
  const up = pts[pts.length - 1] >= pts[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${up ? "var(--green)" : "var(--red)"}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/></svg>`;
}

/* ---------- client API : parle au backend Express ---------- */

async function api(path, options = {}) {
  const res = await fetch(path, {
    method: options.method || "GET",
    headers: options.body instanceof FormData ? undefined : { "Content-Type": "application/json" },
    body: options.body instanceof FormData ? options.body : (options.body ? JSON.stringify(options.body) : undefined),
    credentials: "include",
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* pas de corps JSON */ }
  if (!res.ok) {
    const err = new Error((data && data.error) || `Erreur réseau (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ---------- image : compression avant envoi ---------- */

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read error"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image error"));
      img.onload = () => {
        const maxW = 1100;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
        canvas.toBlob(blob => resolve({ dataUrl, blob }), "image/jpeg", 0.78);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function boot() {
  // pré-remplit le code de parrainage depuis un lien du type /?ref=ABC123
  try {
    const urlRef = new URLSearchParams(window.location.search).get("ref");
    if (urlRef) state.referralCodeInput = urlRef.toUpperCase();
  } catch (e) { /* ignore */ }

  try {
    const me = await api("/api/me");
    state.account = me;
    await loadEverything();
    state.view = "app";
  } catch (e) {
    state.account = null;
    state.view = "auth";
  }
  state.booting = false;
  render();
}

async function submitDeposit() {
  if (state.depositBusy) return;
  const f = state.depositForm;
  if (!f.blob) { showToast("Ajoute une capture d'écran prouvant le dépôt en jeu."); return; }
  const amount = clamp(Math.round(Number(f.amount) || 0), DEPOSIT_MIN_AMOUNT, 1000000);

  state.depositBusy = true; renderModal();
  try {
    const form = new FormData();
    form.append("amount", String(amount));
    form.append("screenshot", f.blob, "preuve.jpg");
    await api("/api/deposits", { method: "POST", body: form });
    state.deposits = await api("/api/mydeposits");
    state.depositModalOpen = false;
    showToast("Demande de dépôt envoyée — en attente de validation par le staff.");
  } catch (e) {
    showToast(e.message);
  }
  state.depositBusy = false;
  render();
}

/* ---------- retraits (player side) ---------- */

function openWithdrawModal() {
  state.withdrawModalOpen = true;
  state.withdrawForm = { amount: Math.max(WITHDRAW_MIN_AMOUNT, Math.min(state.account.balance, 100)) };
  renderModal();

function closeWithdrawModal() {

async function submitWithdraw() {
  if (state.withdrawBusy) return;
  const balance = state.account.balance;
  const amount = clamp(Math.round(Number(state.withdrawForm.amount) || 0), WITHDRAW_MIN_AMOUNT, Math.max(WITHDRAW_MIN_AMOUNT, balance));
  if (amount > balance) { showToast("Solde insuffisant pour ce retrait."); return; }

  state.withdrawBusy = true; renderModal();
  try {
    const r = await api("/api/withdrawals", { method: "POST", body: { amount } });

    state.withdrawModalOpen = false;

}

/* ---------- market view helpers ---------- */

function visibleMarkets() {
  let list = state.filter === "all" ? state.markets : state.markets.filter(m => m.category === state.filter);
  if (state.query.trim()) {
    const q = state.query.trim().toLowerCase();
    list = list.filter(m => m.title.toLowerCase().includes(q));
  }
  return [...list].sort((a, b) => {
    if (a.status !== b.status) return a.status === "open" ? -1 : 1;
    return b.volume - a.volume;
  });
}

/* ---------- betting ---------- */

function openBetModal(marketId, side) {
  state.openBet = { marketId, side };
  state.amount = 50;
  renderModal();
}
function closeBetModal() {
  state.openBet = null;
  renderModal();
}

async function placeBet() {
  if (!state.openBet || state.busy) return;
  const { marketId, side } = state.openBet;
  const stake = clamp(Math.round(state.amount), 10, state.account.balance);
  if (stake < 10 || stake > state.account.balance) { showToast("Mise invalide : pas assez d'émeraudes."); return; }

  state.busy = true; renderModal();
  try {
    const r = await api("/api/bets", { method: "POST", body: { marketId, side, amount: stake } });
    state.account.balance = r.balance;
    const [markets, feed, mybets] = await Promise.all([api("/api/markets"), api("/api/feed"), api("/api/mybets")]);
    state.markets = markets;
    state.feed = feed;
    state.mybets = mybets;
    showToast(`Mise placée : ${r.stake} 💎 sur "${side === "yes" ? "Oui" : "Non"}"`);
    closeBetModal();
  } catch (e) {
    showToast(e.message);
  }
  state.busy = false;
  render();
}

        </div>
        ${sparklineSvg(m.id, m.yes)}
      </div>
      <div class="pct-row">
        <span class="pct" style="color:${m.yes >= 50 ? "var(--green)" : "var(--red)"};">${m.yes}%</span>
        <span class="pct-label">de chances</span>
      </div>
      <div class="probbar"><div style="width:${m.yes}%; background:var(--green);"></div><div style="width:${100 - m.yes}%; background:var(--red);"></div></div>
      ${closed
        ? `<div class="resolved-badge ${m.resolution}">Résolu · ${m.resolution === "yes" ? "Oui" : "Non"}</div>`
        : `<div class="btn-row">
            <button class="btn-yes" data-bet="${m.id}|yes">Oui · ${m.yes}¢</button>

      }
      <div class="card-foot">

      </div>
    </div>
  `;
}

function feedLineHtml(e) {
  const short = e.title.length > 55 ? e.title.slice(0, 55) + "…" : e.title;
  if (e.amount === 0) {
    return `<p class="feed-line">${esc(short)}</p>`;
  }
  return `<p class="feed-line"><span style="color:var(--text);">${esc(e.pseudo)}</span> a misé
    <span style="color:${e.side === "yes" ? "var(--green)" : "var(--red)"};">${e.amount} 💎 sur "${e.side === "yes" ? "Oui" : "Non"}"</span>
    — ${esc(short)}</p>`;
}

function depositLineHtml(d) {
  const label = d.status === "pending" ? "En attente" : d.status === "approved" ? "Approuvé" : "Refusé";
  const color = d.status === "pending" ? "var(--amber)" : d.status === "approved" ? "var(--green)" : "var(--red)";
  const date = new Date(d.ts).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  return `<p class="feed-line"><span style="color:${color}; font-weight:700;">${label}</span> — ${d.amount} 💎 · demandé le ${date}</p>`;
}

function withdrawalLineHtml(w) {
  const label = w.status === "pending" ? "En attente" : w.status === "approved" ? "Payé" : "Refusé";
  const color = w.status === "pending" ? "var(--amber)" : w.status === "approved" ? "var(--green)" : "var(--red)";
  const date = new Date(w.ts).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  return `<p class="feed-line"><span style="color:${color}; font-weight:700;">${label}</span> — ${w.amount} 💎 · demandé le ${date}</p>`;
}

/* ---------- rendering: bet & deposit modal ---------- */

function renderModal() {
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  if (state.depositModalOpen) { renderDepositModalContent(overlay, modal); return; }
  if (state.withdrawModalOpen) { renderWithdrawModalContent(overlay, modal); return; }
  if (state.referralModalOpen) { renderReferralModalContent(overlay, modal); return; }
  if (state.faqModalOpen) { renderFaqModalContent(overlay, modal); return; }
  if (!state.openBet) { overlay.classList.remove("open"); return; }

  const market = state.markets.find(m => m.id === state.openBet.marketId);
  if (!market || market.status !== "open") { closeBetModal(); return; }
  const isYes = state.openBet.side === "yes";
  const balance = state.account.balance;
  const price = isYes ? market.yes : (100 - market.yes);
  const potential = Math.round(state.amount * 100 / Math.max(2, price));
  const quicks = [10, 50, 100, Math.max(10, balance)];

  modal.innerHTML = `
    <div class="modal-head">
      <span class="modal-kicker" style="color:${isYes ? "var(--green)" : "var(--red)"};">Mise sur "${isYes ? "Oui" : "Non"}"</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <p class="modal-title">${esc(market.title)}</p>
    <label class="modal-label">Montant · ${balance} 💎 disponibles</label>
    <div class="amount-row">
      <span style="font-family:var(--font-mono); font-size:15px; color:var(--text-faint);">💎</span>
      <input type="number" id="amountInput" min="10" max="${Math.max(10, balance)}" value="${state.amount}" />
    </div>
    <div class="quick-row">
      ${quicks.map((q, i) => `<button class="quick-btn" data-quick="${q}">${i === 3 ? "Max" : q}</button>`).join("")}
    </div>
    <button class="confirm-btn ${isYes ? "btn-yes" : "btn-no"}" id="confirmBtn" ${state.busy || balance < 10 ? "disabled style='opacity:0.55;'" : ""}>
      ${state.busy ? "Confirmation…" : "Confirmer la mise"}
    </button>
    <p class="price-note">Si "${isYes ? "Oui" : "Non"}" l'emporte, tu recevrais environ ${potential} 💎.</p>
    ${balance < 10 ? `<p class="low-balance">Solde insuffisant pour parier. Reviens demain pour ton bonus quotidien.</p>` : ""}
  `;

  overlay.classList.add("open");
  overlay.onclick = (e) => { if (e.target === overlay) closeBetModal(); };
  document.getElementById("modalClose").addEventListener("click", closeBetModal);
  const amountInput = document.getElementById("amountInput");
  amountInput.addEventListener("input", e => {
    state.amount = clamp(Math.round(Number(e.target.value) || 10), 10, Math.max(10, balance));
    renderModal();
  });
  document.querySelectorAll("[data-quick]").forEach(b => b.addEventListener("click", () => {
    state.amount = clamp(Number(b.dataset.quick), 10, Math.max(10, balance));
    renderModal();
  }));
  const confirmBtn = document.getElementById("confirmBtn");
  if (confirmBtn) confirmBtn.addEventListener("click", placeBet);
}

      ${state.depositBusy ? "Envoi…" : "Envoyer la demande de dépôt"}

  document.getElementById("depModalClose").addEventListener("click", closeDepositModal);
  document.getElementById("depAmountInput").addEventListener("input", e => {
    state.depositForm.amount = clamp(Math.round(Number(e.target.value) || DEPOSIT_MIN_AMOUNT), DEPOSIT_MIN_AMOUNT, 1000000);
  });
  document.getElementById("depFileInput").addEventListener("change", async e => {
    const file = e.target.files[0];

    try {
      const { dataUrl, blob } = await compressImageFile(file);
      state.depositForm.dataUrl = dataUrl;
      state.depositForm.blob = blob;

      renderModal();

      showToast("Impossible de lire cette image.");
    }
  });

  if (confirmBtn) confirmBtn.addEventListener("click", submitDeposit);

  }));
  document.querySelectorAll("[data-approve-dep]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Confirmer ce dépôt ? Le montant sera crédité immédiatement sur le compte du joueur.")) {
      adminApproveDeposit(b.dataset.approveDep);
    }
  }));
  document.querySelectorAll("[data-reject-dep]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Refuser cette demande de dépôt ?")) adminRejectDeposit(b.dataset.rejectDep);
  }));
  document.querySelectorAll("[data-delete-dep]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Supprimer cet historique de dépôt ?")) adminDeleteDeposit(b.dataset.deleteDep);
  }));
  document.querySelectorAll("[data-approve-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Confirmer que tu as bien remis les émeraudes en jeu à ce joueur ?")) {
      adminApproveWithdrawal(b.dataset.approveWd);
    }
  }));
  document.querySelectorAll("[data-reject-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Refuser cette demande de retrait ? Le solde du joueur sera recrédité.")) {
      adminRejectWithdrawal(b.dataset.rejectWd);
    }
  }));
  document.querySelectorAll("[data-delete-wd]").forEach(b => b.addEventListener("click", () => {
    if (confirm("Supprimer cet historique de retrait ?")) adminDeleteWithdrawal(b.dataset.deleteWd);
  }));
  document.querySelectorAll("[data-viewshot]").forEach(el => el.addEventListener("click", () => {
    const dep = state.deposits.find(d => d.id === Number(el.dataset.viewshot) || d.id === el.dataset.viewshot);
    if (dep) viewScreenshotFull(dep.screenshot);
  }));
  document.querySelectorAll("[data-toggle-account]").forEach(el => el.addEventListener("click", () => {
    toggleAccountBets(el.dataset.toggleAccount);
  }));
}

/* ---------- boot ---------- */

boot();
</script>
</body>
</html>
